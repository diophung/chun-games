<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>WiGa · Type2Build</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3ede1;
      color: #222;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    header {
      flex: 0 0 auto;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.15);
      color: #fff;
      font-variant-numeric: tabular-nums;
      font-size: clamp(14px, 3.5vw, 18px);
    }
    header nav { display: flex; gap: 12px; }
    header nav a {
      color: #fff;
      text-decoration: none;
      opacity: 0.85;
      border-bottom: 1px dashed rgba(255,255,255,0.5);
    }
    header nav a:hover { opacity: 1; }
    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      gap: 6px;
    }
    /* The single car photo. Starts grayscale; saturation rises as you type. */
    #car-photo {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      filter: saturate(0);
      transition: filter 220ms ease;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }
    #car-photo.vrooming {
      animation: vroom-bounce 600ms cubic-bezier(0.34, 1.4, 0.5, 1) both;
    }
    @keyframes vroom-bounce {
      0%   { transform: translateX(0)    scale(1); }
      25%  { transform: translateX(24px) scale(1.04); }
      55%  { transform: translateX(-12px) scale(1.0); }
      80%  { transform: translateX(8px)  scale(1.02); }
      100% { transform: translateX(0)    scale(1); }
    }
    #car-caption {
      text-align: center;
      font-size: clamp(11px, 2.4vw, 13px);
      color: rgba(0,0,0,0.55);
      font-weight: 600;
      letter-spacing: 0.02em;
      min-height: 1.2em;
    }
    #word-area {
      flex: 0 0 auto;
      padding: 12px 16px 16px;
      background: #fff;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    #word-display {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(28px, 8vw, 44px);
      letter-spacing: 0.08em;
      text-align: center;
      font-weight: 700;
      user-select: none;
      min-height: 1.2em;
      transition: transform 120ms ease;
    }
    #word-display .typed { color: #16a34a; }
    #word-display .untyped { color: #888; }
    #word-display.flash-red { animation: flashRed 220ms ease; }
    @keyframes flashRed {
      0%   { color: #dc2626; transform: translateX(0); }
      25%  { transform: translateX(-4px); }
      50%  { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    #word-timer-bar {
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }
    #word-timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #facc15, #ef4444);
      transition: width 120ms linear;
    }
    #word-input {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(20px, 5.5vw, 28px);
      padding: 12px 14px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      text-align: center;
      letter-spacing: 0.08em;
      width: 100%;
    }
    #word-input:focus { border-color: #2563eb; }
    #end-screen {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      z-index: 10;
    }
    #end-screen[hidden] { display: none !important; }
    #end-headline { font-size: clamp(28px, 8vw, 48px); margin: 0; }
    #end-stats {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: clamp(16px, 4vw, 22px);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    #end-stats li { padding: 4px 0; }
    #play-again {
      font-size: clamp(18px, 5vw, 24px);
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
    }
    #play-again:active { transform: translateY(1px); }

    /* Confetti — short 1-second burst on word complete. */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      overflow: hidden;
    }
    #confetti[hidden] { display: none !important; }
    .confetti-piece {
      position: absolute;
      width: 9px;
      height: 13px;
      will-change: transform, opacity;
      animation: confetti-fly 950ms cubic-bezier(0.45, 0.05, 0.55, 1) forwards;
    }
    @keyframes confetti-fly {
      0%   { transform: translate(0, 0)        rotate(0deg);                 opacity: 1; }
      100% { transform: translate(var(--cdx), var(--cdy)) rotate(var(--crot)); opacity: 0; }
    }

    @media (max-width: 480px) {
      header { padding: 6px 10px; }
      main { padding: 4px; }
      #word-area { padding: 10px 12px 12px; }
    }
    @supports (height: 100dvh) {
      body { min-height: 100dvh; height: 100dvh; }
    }
    #word-input::placeholder { color: #9ca3af; }

   /* WiGa minimal chrome — small floating back-link + footer
      so the game canvas stays full-screen. */
   .wiga-back {
     position: fixed;
     top: 10px;
     left: 10px;
     z-index: 1000;
     display: inline-flex;
     align-items: center;
     gap: 6px;
     padding: 6px 12px;
     border-radius: 999px;
     background: rgba(255, 248, 240, 0.92);
     color: #2a2a3a;
     font-family: "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, sans-serif;
     font-weight: 800;
     font-size: 13px;
     text-decoration: none;
     border: 2px solid #b8e8d4;
     box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
   }
   .wiga-back:hover { background: rgba(184, 232, 212, 1); }
   .wiga-mini-footer {
     position: fixed;
     bottom: 8px;
     right: 12px;
     z-index: 1000;
     display: inline-flex;
     align-items: center;
     gap: 8px;
     padding: 4px 10px;
     border-radius: 999px;
     background: rgba(255, 248, 240, 0.85);
     color: #5b6072;
     font-family: "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, sans-serif;
     font-size: 11px;
     font-weight: 600;
   }
   .wiga-mini-footer a {
     color: #5b6072;
     text-decoration: none;
     border-bottom: 1px dashed rgba(91, 96, 114, 0.4);
   }
   .wiga-mini-footer a:hover { color: #b13a55; border-bottom-color: #b13a55; }
  </style>
</head>
<body>
  <a class="wiga-back" href="../index.html" aria-label="Back to WiGa home">← WiGa</a>
  <header>
    <div id="global-timer">90.0s</div>
    <nav aria-label="other games">
      <a href="../index.html">Home</a>
      <a href="zoomy-car.html">Zoomy Cars</a>
      <a href="child-feeder.html">Child Feeder</a>
      <a href="car-memory.html">Car Memory</a>
    </nav>
    <div id="stats-mini">0 / 12</div>
  </header>
  <main id="garage">
    <img id="car-photo" alt="" />
    <div id="car-caption" aria-live="polite"></div>
  </main>
  <section id="word-area">
    <div id="word-display" aria-live="polite">&mdash;</div>
    <div id="word-timer-bar"><div id="word-timer-fill"></div></div>
    <input
      id="word-input"
      type="text"
      inputmode="latin"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      autofocus
      placeholder="type here"
      aria-label="type the word"
    />
  </section>
  <section id="end-screen" hidden>
    <h2 id="end-headline"></h2>
    <ul id="end-stats"></ul>
    <button id="play-again" type="button">Play Again</button>
  </section>
  <div id="confetti" hidden aria-hidden="true"></div>
  <div class="wiga-mini-footer">
    Made by William with ❤️ and 🤖 ·
    <a href="https://github.com/diophung/chun-games" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>
  <script src="high-scores.js"></script>
  <script>
    (function () {
      "use strict";

      const CAR_COUNT = 12;
      const WORD_TIMER_PER_CHAR = 1.2;   // seconds per character
      const GLOBAL_TIMER_START = 90;     // seconds
      const TYPO_PENALTY = 2;            // seconds deducted from global timer per typo
      const CELEBRATE_MS = 1000;         // total celebration window per word complete

      const WORDS = [
        "sedan","coupe","wagon","truck","tires","turbo","motor","drift","rally","viper",
        "hybrid","engine","piston","brakes","clutch","wheels","bumper","fender","mirror",
        "carbon","diesel","petrol","garage","tunnel","airbag","camaro","beetle","jaguar",
        "gasket","gearbox","chassis","exhaust","highway","traffic","license","mileage",
        "battery","sunroof","ferrari","mustang","porsche","shifter","muffler","antenna",
        "ignition","radiator","seatbelt","steering"
      ];

      // 12 hyper-realistic supercar photos sourced from Wikimedia Commons.
      // See games/cars/CREDITS.md for per-photo attribution + license.
      const PHOTOS = [
        { src: "cars/01.jpg", label: "Bugatti Veyron 16.4" },
        { src: "cars/02.jpg", label: "Lamborghini Aventador SV" },
        { src: "cars/03.jpg", label: "Ferrari LaFerrari" },
        { src: "cars/04.jpg", label: "Porsche 911 GT3 (992)" },
        { src: "cars/05.jpg", label: "McLaren P1" },
        { src: "cars/06.jpg", label: "Pagani Huayra" },
        { src: "cars/07.jpg", label: "Koenigsegg Agera N" },
        { src: "cars/08.jpg", label: "Aston Martin Vantage V8" },
        { src: "cars/09.jpg", label: "Mercedes-AMG GT" },
        { src: "cars/10.jpg", label: "Audi R8 V10 plus" },
        { src: "cars/11.jpg", label: "Nissan GT-R (R35)" },
        { src: "cars/12.jpg", label: "Chevrolet Corvette C8" },
      ];

      const state = {
        phase: "idle",
        endReason: null,
        wordQueue: [],
        currentWord: null,
        currentPhotoIdx: null,
        previousPhotoIdx: null,
        wordTimer: 0,
        globalTimer: GLOBAL_TIMER_START,
        typos: 0,
        correctChars: 0,
        carsCompleted: 0,
        lastFrameMs: 0,
      };

      const els = {
        globalTimer: document.getElementById("global-timer"),
        statsMini:   document.getElementById("stats-mini"),
        wordDisplay: document.getElementById("word-display"),
        wordFill:    document.getElementById("word-timer-fill"),
        input:       document.getElementById("word-input"),
        wordArea:    document.getElementById("word-area"),
        endScreen:   document.getElementById("end-screen"),
        endHeadline: document.getElementById("end-headline"),
        endStats:    document.getElementById("end-stats"),
        playAgain:   document.getElementById("play-again"),
        photo:       document.getElementById("car-photo"),
        caption:     document.getElementById("car-caption"),
        confetti:    document.getElementById("confetti"),
      };

      // ----- Pure helpers -----
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function formatSeconds(s) {
        return (Math.max(0, s)).toFixed(1) + "s";
      }

      // Pick a random photo index, with no consecutive repeat.
      function pickNextPhotoIdx() {
        if (PHOTOS.length <= 1) return 0;
        let idx;
        do {
          idx = Math.floor(Math.random() * PHOTOS.length);
        } while (idx === state.previousPhotoIdx);
        return idx;
      }

      function applyPhotoSaturation(progress) {
        const sat = Math.max(0, Math.min(1, progress));
        // Use toFixed to keep the inline style short and deterministic.
        els.photo.style.filter = "saturate(" + sat.toFixed(3) + ")";
      }

      // ----- Render helpers (no innerHTML; build DOM nodes explicitly) -----
      function renderWordDisplay(typedLen) {
        const target = state.currentWord || "";
        const frag = document.createDocumentFragment();
        if (target.length === 0) {
          frag.appendChild(document.createTextNode("—"));
        } else {
          for (let i = 0; i < target.length; i++) {
            const span = document.createElement("span");
            span.className = i < typedLen ? "typed" : "untyped";
            span.textContent = target[i];
            frag.appendChild(span);
          }
        }
        els.wordDisplay.replaceChildren(frag);
      }

      function renderTimers() {
        els.globalTimer.textContent = formatSeconds(state.globalTimer);
        els.statsMini.textContent = state.carsCompleted + " / " + CAR_COUNT;
        const total = (state.currentWord ? state.currentWord.length : 1) * WORD_TIMER_PER_CHAR;
        const pct = Math.max(0, Math.min(100, (state.wordTimer / total) * 100));
        els.wordFill.style.width = pct + "%";
      }

      function flashRed() {
        els.wordDisplay.classList.remove("flash-red");
        void els.wordDisplay.offsetWidth;
        els.wordDisplay.classList.add("flash-red");
      }

      // ----- Audio: synthesized engine "vroom" -----
      let audioCtx = null;
      function ensureAudio() {
        if (audioCtx) return audioCtx;
        try {
          const Ctor = window.AudioContext || window.webkitAudioContext;
          if (!Ctor) return null;
          audioCtx = new Ctor();
        } catch (err) {
          audioCtx = null;
        }
        return audioCtx;
      }
      function playVroom() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(70, t0);
        osc.frequency.exponentialRampToValueAtTime(280, t0 + 0.22);
        osc.frequency.exponentialRampToValueAtTime(150, t0 + 0.55);

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(900, t0);
        filter.frequency.exponentialRampToValueAtTime(1800, t0 + 0.22);
        filter.frequency.exponentialRampToValueAtTime(700, t0 + 0.55);
        filter.Q.value = 0.9;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.22, t0 + 0.04);
        gain.gain.linearRampToValueAtTime(0.0, t0 + 0.6);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.65);
      }

      // ----- Confetti at a screen position -----
      function spawnConfetti(centerX, centerY) {
        const palette = ["#e74c3c", "#3498db", "#f1c40f", "#27ae60", "#9b59b6", "#e67e22", "#1abc9c", "#e84393"];
        const N = 22;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < N; i++) {
          const piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.left = (centerX - 4) + "px";
          piece.style.top  = (centerY - 6) + "px";
          piece.style.background = palette[i % palette.length];
          const angle = (Math.random() * Math.PI) - Math.PI;
          const dist  = 110 + Math.random() * 130;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist + 30;
          piece.style.setProperty("--cdx", dx.toFixed(0) + "px");
          piece.style.setProperty("--cdy", dy.toFixed(0) + "px");
          piece.style.setProperty("--crot", (Math.random() * 720 - 360).toFixed(0) + "deg");
          frag.appendChild(piece);
        }
        els.confetti.replaceChildren(frag);
        els.confetti.hidden = false;
        setTimeout(() => { els.confetti.hidden = true; els.confetti.replaceChildren(); }, CELEBRATE_MS);
      }

      function celebratePhoto() {
        // Lock the photo at full color and play the vroom + confetti for ~1s.
        applyPhotoSaturation(1);
        els.photo.classList.add("vrooming");
        playVroom();
        const rect = els.photo.getBoundingClientRect();
        spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
        setTimeout(() => els.photo.classList.remove("vrooming"), 650);
      }

      // ----- Game lifecycle -----
      function startGame() {
        state.phase = "playing";
        state.endReason = null;
        state.wordQueue = shuffle(WORDS).slice(0, CAR_COUNT);
        state.currentPhotoIdx = null;
        state.previousPhotoIdx = null;
        state.globalTimer = GLOBAL_TIMER_START;
        state.typos = 0;
        state.correctChars = 0;
        state.carsCompleted = 0;
        state.lastFrameMs = 0;

        els.endScreen.hidden = true;
        els.confetti.hidden = true;
        els.confetti.replaceChildren();
        els.wordArea.hidden = false;
        els.input.value = "";
        els.photo.classList.remove("vrooming");

        loadNextWord();
        renderTimers();
        requestAnimationFrame(tick);
        els.input.focus();
      }

      function loadNextWord() {
        if (state.wordQueue.length === 0) {
          state.currentWord = null;
          state.wordTimer = 0;
          renderWordDisplay(0);
          if (state.phase === "playing") {
            endGame(state.carsCompleted === CAR_COUNT ? "win" : "timeout");
          }
          return;
        }

        state.currentWord = state.wordQueue.shift();
        state.wordTimer = state.currentWord.length * WORD_TIMER_PER_CHAR;
        els.input.value = "";
        renderWordDisplay(0);
        renderTimers();

        // Pick the next photo (no consecutive repeat) and reset to grayscale.
        state.previousPhotoIdx = state.currentPhotoIdx;
        state.currentPhotoIdx  = pickNextPhotoIdx();
        const photo = PHOTOS[state.currentPhotoIdx];
        els.photo.src = photo.src;
        els.photo.alt = photo.label;
        els.caption.textContent = photo.label;
        applyPhotoSaturation(0);
      }

      function tick(now) {
        if (state.phase !== "playing") return;
        const dt = state.lastFrameMs ? (now - state.lastFrameMs) / 1000 : 0;
        state.lastFrameMs = now;

        state.globalTimer = Math.max(0, state.globalTimer - dt);
        state.wordTimer   = Math.max(0, state.wordTimer - dt);
        renderTimers();

        if (state.globalTimer <= 0) {
          endGame("timeout");
          return;
        }

        if (state.wordTimer <= 0 && state.currentWord) {
          // Word timed out — abandon this car (leave it partly colored) and move on.
          state.currentWord = null;
          loadNextWord();
        }

        requestAnimationFrame(tick);
      }

      function endGame(reason) {
        state.phase = "ended";
        state.endReason = reason;
        const totalTime = (GLOBAL_TIMER_START - state.globalTimer).toFixed(1);
        const denom = state.correctChars + state.typos;
        const accuracy = denom === 0 ? 100 : Math.round((state.correctChars / denom) * 100);
        const score = Math.max(0, Math.round(
          state.carsCompleted * 1000 +
          (state.carsCompleted > 0 ? accuracy * 20 : 0) +
          Math.max(0, state.globalTimer) * 50 -
          state.typos * 100 +
          (reason === "win" ? 5000 : 0)
        ));

        els.endHeadline.textContent =
          reason === "win" ? "Garage filled!" : "Time's up!";

        const stats = [
          "Time used: " + totalTime + "s",
          "Cars finished: " + state.carsCompleted + " / " + CAR_COUNT,
          "Typos: " + state.typos,
          "Accuracy: " + accuracy + "%",
          "Score: " + score + " pts",
        ];
        const frag = document.createDocumentFragment();
        for (const line of stats) {
          const li = document.createElement("li");
          li.textContent = line;
          frag.appendChild(li);
        }
        els.endStats.replaceChildren(frag);

        if (window.ChunHighScores) {
          window.ChunHighScores.record({
            gameId: "type2build",
            gameName: "Type2Build",
            score,
            scoreLabel: "pts",
            detail: state.carsCompleted + "/" + CAR_COUNT + " cars · " + accuracy + "% · " + totalTime + "s",
          });
          window.ChunHighScores.render(els.endScreen, "type2build", { scoreLabel: "pts" }, els.playAgain);
        }

        els.endScreen.hidden = false;
        els.playAgain.focus();
      }

      function onInput() {
        if (state.phase !== "playing" || !state.currentWord) return;
        const current = els.input.value;
        const target = state.currentWord;

        // Find longest valid prefix.
        let validLen = 0;
        while (
          validLen < current.length &&
          validLen < target.length &&
          current[validLen] === target[validLen]
        ) {
          validLen++;
        }

        if (validLen < current.length) {
          // Typo — roll back to last valid prefix and dock global timer.
          els.input.value = current.slice(0, validLen);
          state.typos += 1;
          state.globalTimer = Math.max(0, state.globalTimer - TYPO_PENALTY);
          flashRed();
          renderWordDisplay(validLen);
          applyPhotoSaturation(validLen / target.length);
          renderTimers();
          return;
        }

        renderWordDisplay(current.length);
        applyPhotoSaturation(current.length / target.length);

        if (current === target) {
          state.correctChars += target.length;
          state.carsCompleted += 1;
          celebratePhoto();
          renderTimers();
          // Hold the completed photo on screen for 1s, then load the next word.
          const finishedWord = state.currentWord;
          state.currentWord = null;
          setTimeout(() => {
            if (state.phase === "playing" && state.currentWord === null) loadNextWord();
          }, CELEBRATE_MS);
        }
      }

      // ----- Wire up DOM events -----
      els.input.addEventListener("input", onInput);

      els.playAgain.addEventListener("click", () => {
        startGame();
      });

      // Re-focus the input on any tap inside the page during play.
      document.addEventListener("click", (e) => {
        if (state.phase !== "playing") return;
        if (e.target === els.input) return;
        if (e.target === els.playAgain) return;
        els.input.focus();
      });

      // Prevent paste cheating.
      els.input.addEventListener("paste", (e) => e.preventDefault());

      // Resume audio context on first user gesture (browsers require this).
      const resumeAudio = () => {
        const ctx = ensureAudio();
        if (ctx && ctx.state === "suspended") ctx.resume();
      };
      document.addEventListener("pointerdown", resumeAudio, { once: true });
      els.input.addEventListener("focus", resumeAudio, { once: true });

      // Auto-start on load.
      startGame();
    })();
  </script>
</body>
</html>
