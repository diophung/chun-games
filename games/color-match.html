<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Chun-Ga · Color Match Rush</title>
  <link rel="stylesheet" href="../assets/site.css?v=4" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #17324d;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      touch-action: manipulation;
    }
    @supports (height: 100dvh) {
      body { min-height: 100dvh; }
    }
    #app {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #app > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: rgba(255,255,255,0.78);
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(31,41,55,0.12);
      font-variant-numeric: tabular-nums;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 32px);
      line-height: 1;
      color: #1d4ed8;
      text-shadow: 0 2px 0 rgba(255,255,255,0.8);
    }
    .stats, nav.game-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stat {
      background: #ffffff;
      border: 2px solid #c7d2fe;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: clamp(13px, 3.2vw, 15px);
      font-weight: 700;
      color: #1e3a8a;
    }
    .stat strong { color: #ef476f; margin-left: 4px; }
    nav.game-nav a, button.linky {
      color: #1d4ed8;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      border: none;
      border-bottom: 2px dashed rgba(29,78,216,0.4);
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    #hint {
      margin: 0;
      text-align: center;
      padding: 8px 14px;
      background: rgba(255,255,255,0.78);
      border-radius: 14px;
      color: #475569;
      font-size: clamp(13px, 3.2vw, 15px);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(31,41,55,0.08);
    }
    #hint .chip-mini {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      vertical-align: -2px;
      margin: 0 2px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6);
    }

    #target {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 12px;
      background: rgba(255,255,255,0.82);
      border-radius: 22px;
      box-shadow: 0 8px 22px rgba(31,41,55,0.14);
    }
    #target-label {
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #64748b;
    }
    #target-chip {
      width: clamp(64px, 18vw, 96px);
      height: clamp(64px, 18vw, 96px);
      border-radius: 50%;
      box-shadow: 0 6px 14px rgba(31,41,55,0.25), inset 0 -6px 0 rgba(0,0,0,0.12), inset 0 6px 0 rgba(255,255,255,0.25);
      border: 4px solid #ffffff;
      transition: background-color 200ms ease;
    }
    #target-word {
      font-size: clamp(36px, 10vw, 60px);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(255,255,255,0.7);
    }

    #timer-track {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.65);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(31,41,55,0.12);
    }
    #timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4ade80, #facc15 60%, #ef4444);
      transition: width 60ms linear;
      border-radius: 999px;
    }
    #timer-fill.danger { background: #ef4444; }

    #choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .choice {
      position: relative;
      aspect-ratio: 1 / 1;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .choice:focus-visible {
      outline: 4px solid #1d4ed8;
      outline-offset: 4px;
      border-radius: 22px;
    }
    .choice-inner {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background: rgba(255,255,255,0.82);
      box-shadow: 0 8px 18px rgba(31,41,55,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease, box-shadow 180ms ease;
    }
    .choice:active .choice-inner { transform: translateY(2px); }
    .choice svg {
      width: 70%;
      height: 70%;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
    }
    .choice.correct .choice-inner {
      box-shadow: 0 0 0 5px #16a34a, 0 8px 18px rgba(31,41,55,0.16);
    }
    .choice.wrong .choice-inner {
      box-shadow: 0 0 0 5px #ef4444, 0 8px 18px rgba(31,41,55,0.16);
    }
    .shake { animation: shake 320ms ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    #end-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 22px;
      background: rgba(23,50,77,0.92);
      color: #fff;
      text-align: center;
    }
    #end-screen[hidden] { display: none !important; }
    #end-screen h2 {
      margin: 0;
      font-size: clamp(28px, 8vw, 48px);
    }
    #end-stats {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: clamp(16px, 4vw, 21px);
      font-variant-numeric: tabular-nums;
    }
    #end-stats li { padding: 4px 0; }
    .primary {
      min-height: 48px;
      border: none;
      border-radius: 999px;
      padding: 12px 26px;
      background: #ffd166;
      color: #17324d;
      font: inherit;
      font-size: clamp(17px, 4vw, 21px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.22);
      touch-action: manipulation;
    }
    .primary:active { transform: translateY(1px); }

    @media (max-width: 520px) {
      body { padding: 8px; }
      #app > header { justify-content: center; text-align: center; }
      #choices { gap: 8px; }
      .choice-inner { border-radius: 18px; }
    }
    @media (min-width: 520px) {
      #choices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="site-header"><div class="site-header__inner">
    <a class="site-logo" href="../index.html">🎮 WiGa <span class="site-logo__sub" data-i18n="logo.sub">— William's Games</span></a>
    <nav class="site-nav" aria-label="Primary" data-i18n-aria-label="nav.aria">
      <a class="site-nav__link" href="../index.html" data-i18n="nav.single">Single Player</a>
      <a class="site-nav__link" href="../multiplayer.html" data-i18n="nav.multi">Multi-Player</a>
      <a class="site-nav__link" href="../high-scores.html" data-i18n="nav.scores">High Scores</a>
      <a class="site-nav__link" href="../donate.html" data-i18n="nav.donate">Donate</a>
      <div class="lang-picker">
        <button class="lang-picker__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span>Language: English</span>
          <span class="lang-picker__chevron" aria-hidden="true">▾</span>
        </button>
        <ul class="lang-picker__menu" role="listbox" hidden>
          <li><button class="lang-picker__option" type="button" data-lang="en" role="option" aria-selected="true">Language: English</button></li>
          <li><button class="lang-picker__option" type="button" data-lang="vi" role="option" aria-selected="false">Ngôn ngữ: Tiếng Việt</button></li>
          <li><button class="lang-picker__option" type="button" data-lang="es" role="option" aria-selected="false">Idioma: Español</button></li>
          <li><button class="lang-picker__option" type="button" data-lang="zh" role="option" aria-selected="false">语言: 中文</button></li>
        </ul>
      </div>
    </nav>
  </div></header>

  <main id="app">
    <header>
      <h1>🌈 Color Match Rush</h1>
      <div class="stats" aria-label="game stats">
        <div class="stat">Score<strong id="score-count">0</strong></div>
        <div class="stat">Round<strong id="round-count">1</strong></div>
        <div class="stat">Time<strong id="time-count">3.0s</strong></div>
      </div>
      <nav class="game-nav" aria-label="game navigation">
        <a href="../index.html">Home</a>
        <button class="linky" id="restart-btn" type="button">Restart</button>
      </nav>
    </header>

    <p id="hint">Tap the shape whose color matches the <span class="chip-mini" style="background:#ef4444"></span> colored circle. Ignore the word!</p>

    <section id="target" aria-label="target color">
      <span id="target-label">Match this color</span>
      <div id="target-chip" aria-hidden="true"></div>
      <div id="target-word" aria-live="polite">RED</div>
    </section>

    <div id="timer-track" aria-hidden="true"><div id="timer-fill"></div></div>

    <section id="choices" aria-label="color choices"></section>
  </main>

  <section id="end-screen" hidden>
    <h2 id="end-title">⏰ Time's up!</h2>
    <ul id="end-stats"></ul>
    <button class="primary" id="play-again" type="button">Play Again</button>
  </section>

  <footer class="site-footer"><div class="site-footer__inner">
    <span data-i18n="footer.credit">Made by William with ❤️ and 🤖</span>
    <span class="site-footer__links">
      <a href="https://github.com/diophung/chun-games" target="_blank" rel="noopener noreferrer">GitHub</a>
    </span>
  </div></footer>

  <script src="high-scores.js"></script>
  <script>
    (function () {
      "use strict";

      // Kid-friendly palette: bright, easy-to-distinguish colors with names a 7-year-old knows.
      const COLORS = [
        { name: "RED",    hex: "#ef4444" },
        { name: "BLUE",   hex: "#2563eb" },
        { name: "GREEN",  hex: "#16a34a" },
        { name: "YELLOW", hex: "#facc15" },
        { name: "PURPLE", hex: "#a855f7" },
        { name: "ORANGE", hex: "#f97316" },
        { name: "PINK",   hex: "#ec4899" },
        { name: "CYAN",   hex: "#06b6d4" },
      ];

      const SHAPES = ["circle", "star"];

      const START_MS = 3000;
      const STEP_MS = 50;          // shrink per step
      const STEP_EVERY = 5;        // every N rounds
      const FLOOR_MS = 1000;       // never go below 1s
      const STROOP_AFTER_ROUND = 10; // word/chip may disagree starting at round 11
      const TIMER_TICK_MS = 60;    // UI tick

      const els = {
        score: document.getElementById("score-count"),
        round: document.getElementById("round-count"),
        time: document.getElementById("time-count"),
        targetChip: document.getElementById("target-chip"),
        targetWord: document.getElementById("target-word"),
        timerFill: document.getElementById("timer-fill"),
        choices: document.getElementById("choices"),
        restart: document.getElementById("restart-btn"),
        endScreen: document.getElementById("end-screen"),
        endTitle: document.getElementById("end-title"),
        endStats: document.getElementById("end-stats"),
        playAgain: document.getElementById("play-again"),
        hint: document.getElementById("hint"),
      };

      const state = {
        score: 0,
        round: 0,
        roundLimitMs: START_MS,
        roundStart: 0,
        timerId: 0,
        accepting: false,
        target: null, // { name, hex } — this is the CHIP color (the rule)
        ended: false,
        scoreRecorded: false,
      };

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function svgEl(name) {
        return document.createElementNS("http://www.w3.org/2000/svg", name);
      }

      function shapeSvg(kind, color) {
        const svg = svgEl("svg");
        svg.setAttribute("viewBox", "0 0 100 100");
        svg.setAttribute("aria-hidden", "true");
        if (kind === "star") {
          const path = svgEl("path");
          path.setAttribute("d", "M50 8 L61 38 L93 40 L68 60 L77 92 L50 74 L23 92 L32 60 L7 40 L39 38 Z");
          path.setAttribute("fill", color);
          path.setAttribute("stroke", "rgba(0,0,0,0.22)");
          path.setAttribute("stroke-width", "3");
          path.setAttribute("stroke-linejoin", "round");
          svg.appendChild(path);
        } else {
          const circle = svgEl("circle");
          circle.setAttribute("cx", "50");
          circle.setAttribute("cy", "50");
          circle.setAttribute("r", "42");
          circle.setAttribute("fill", color);
          circle.setAttribute("stroke", "rgba(0,0,0,0.22)");
          circle.setAttribute("stroke-width", "3");
          svg.appendChild(circle);
        }
        return svg;
      }

      function computeRoundLimit(roundIdx) {
        // roundIdx is 1-based round number for the upcoming round.
        const steps = Math.floor((roundIdx - 1) / STEP_EVERY);
        return Math.max(FLOOR_MS, START_MS - steps * STEP_MS);
      }

      function setTimerUi(remainingMs) {
        const pct = Math.max(0, Math.min(100, (remainingMs / state.roundLimitMs) * 100));
        els.timerFill.style.width = pct + "%";
        if (pct < 25) {
          els.timerFill.classList.add("danger");
        } else {
          els.timerFill.classList.remove("danger");
        }
        els.time.textContent = (remainingMs / 1000).toFixed(1) + "s";
      }

      function clearTimer() {
        if (state.timerId) {
          clearInterval(state.timerId);
          state.timerId = 0;
        }
      }

      function startRoundTimer() {
        clearTimer();
        state.roundStart = performance.now();
        setTimerUi(state.roundLimitMs);
        state.timerId = setInterval(() => {
          const elapsed = performance.now() - state.roundStart;
          const remaining = state.roundLimitMs - elapsed;
          if (remaining <= 0) {
            setTimerUi(0);
            clearTimer();
            timeOut();
          } else {
            setTimerUi(remaining);
          }
        }, TIMER_TICK_MS);
      }

      function nextRound() {
        if (state.ended) return;
        state.round += 1;
        state.roundLimitMs = computeRoundLimit(state.round);
        els.round.textContent = String(state.round);

        // Pick the target color (this is the CHIP color, which is the rule).
        const targetColor = pick(COLORS);
        state.target = targetColor;

        // Pick the displayed word. After round 10, sometimes mismatch on purpose
        // (Stroop twist). The rule for the player stays: match the CHIP, ignore the word.
        let wordColor = targetColor;
        if (state.round > STROOP_AFTER_ROUND && Math.random() < 0.55) {
          const others = COLORS.filter(c => c.name !== targetColor.name);
          wordColor = pick(others);
        }

        // The word text itself can be any color name — make it interesting after round 10.
        let wordText = targetColor.name;
        if (state.round > STROOP_AFTER_ROUND && Math.random() < 0.55) {
          const others = COLORS.filter(c => c.name !== targetColor.name);
          wordText = pick(others).name;
        }

        els.targetChip.style.backgroundColor = targetColor.hex;
        els.targetWord.textContent = wordText;
        els.targetWord.style.color = wordColor.hex;

        // Build 4 unique choices including the target color.
        const distractors = shuffle(COLORS.filter(c => c.name !== targetColor.name)).slice(0, 3);
        const choices = shuffle([targetColor].concat(distractors));

        const frag = document.createDocumentFragment();
        for (let i = 0; i < choices.length; i++) {
          const c = choices[i];
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice";
          btn.setAttribute("aria-label", c.name);
          btn.dataset.colorName = c.name;

          const inner = document.createElement("span");
          inner.className = "choice-inner";
          // Mix up the shape per choice so the game stays visually playful.
          const shape = pick(SHAPES);
          inner.appendChild(shapeSvg(shape, c.hex));
          btn.appendChild(inner);

          // Use a single pointer handler so touch and mouse both fire exactly once.
          // touchstart fires before the synthesized click; preventDefault stops the
          // browser from also firing click / 300ms tap-delay.
          const onPick = (evt) => {
            if (evt) evt.preventDefault();
            handlePick(btn, c);
          };
          btn.addEventListener("touchstart", onPick, { passive: false });
          // Fallback for mouse / keyboard. Skipped on touch because preventDefault above
          // already swallows the synthesized click.
          btn.addEventListener("click", onPick);

          frag.appendChild(btn);
        }
        els.choices.replaceChildren(frag);

        state.accepting = true;
        startRoundTimer();
      }

      function handlePick(btn, color) {
        if (!state.accepting || state.ended) return;
        const correct = color.name === state.target.name;
        if (correct) {
          state.accepting = false;
          clearTimer();
          state.score += 1;
          els.score.textContent = String(state.score);
          btn.classList.add("correct");
          // Tiny delay so the green ring is visible before the next round.
          setTimeout(nextRound, 120);
        } else {
          // Wrong tap = +0 and a short shake. Round continues.
          btn.classList.add("wrong", "shake");
          setTimeout(() => {
            btn.classList.remove("wrong", "shake");
          }, 360);
        }
      }

      function timeOut() {
        endGame("time");
      }

      function endGame(reason) {
        if (state.ended) return;
        state.ended = true;
        state.accepting = false;
        clearTimer();

        els.endTitle.textContent = reason === "time" ? "⏰ Time's up!" : "🎉 Game over!";
        const stats = [
          "Score: " + state.score + " " + (state.score === 1 ? "match" : "matches"),
          "Rounds played: " + state.round,
          "Final round time: " + (state.roundLimitMs / 1000).toFixed(2) + "s",
        ];
        const frag = document.createDocumentFragment();
        for (const line of stats) {
          const li = document.createElement("li");
          li.textContent = line;
          frag.appendChild(li);
        }
        els.endStats.replaceChildren(frag);

        if (!state.scoreRecorded && window.ChunHighScores) {
          state.scoreRecorded = true;
          window.ChunHighScores.record({
            gameId: "color-match",
            gameName: "Color Match Rush",
            score: state.score,
            scoreLabel: "matches",
            detail: "round " + state.round,
          });
          window.ChunHighScores.render(
            els.endScreen,
            "color-match",
            { scoreLabel: "matches" },
            els.playAgain
          );
        }
        els.endScreen.hidden = false;
        els.playAgain.focus();
      }

      function resetState() {
        clearTimer();
        state.score = 0;
        state.round = 0;
        state.roundLimitMs = START_MS;
        state.accepting = false;
        state.ended = false;
        state.scoreRecorded = false;
        state.target = null;
        els.score.textContent = "0";
        els.round.textContent = "1";
        setTimerUi(START_MS);
      }

      function startGame() {
        els.endScreen.hidden = true;
        resetState();
        nextRound();
      }

      els.restart.addEventListener("click", startGame);
      els.playAgain.addEventListener("click", startGame);
      // Touch-start support for Play Again on mobile so it fires instantly.
      els.playAgain.addEventListener("touchstart", (e) => {
        e.preventDefault();
        startGame();
      }, { passive: false });

      startGame();
    })();
  </script>
  <script src="../assets/site.js"></script>
  <script src="../assets/i18n.js?v=4"></script>
</body>
</html>
