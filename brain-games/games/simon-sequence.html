<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Simon Sequence 🎶</title>
<style>
  :root{
    --bg-grad: linear-gradient(160deg,#2b1e66 0%, #3b2fb0 45%, #1f6feb 100%);
    --paper:#ffffff; --ink:#13183a; --ink-soft:#5b6488;
    --c-blue:#3a86ff; --c-orange:#fb8500; --c-green:#06d6a0; --c-pink:#ff5d8f; --c-yellow:#ffd166; --c-purple:#9b5de5;
    --ok:#06d6a0; --warn:#ff6b6b; --radius:20px;
    --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg-grad) fixed;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  @supports (height:100dvh){ body{ min-height:100dvh; } }

  h1,h2,h3{ font-weight:800; margin:0; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    background:rgba(19,24,58,0.35);
    backdrop-filter:blur(6px);
  }
  .topbar .spacer{ flex:1 1 auto; }
  .hud{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center;
    flex:1 1 auto;
  }
  .chip{
    background:rgba(255,255,255,0.92);
    color:var(--ink);
    border-radius:999px;
    padding:6px 12px;
    font-weight:800;
    font-size:clamp(13px,3.4vw,16px);
    font-variant-numeric:tabular-nums;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:5px;
    white-space:nowrap;
  }
  .chip small{ font-weight:700; color:var(--ink-soft); font-size:0.78em; }

  .iconbtn{
    appearance:none; border:none; cursor:pointer;
    min-width:48px; min-height:48px;
    border-radius:999px;
    background:rgba(255,255,255,0.92);
    color:var(--ink);
    font-size:22px; font-weight:800;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
    display:inline-flex; align-items:center; justify-content:center;
    text-decoration:none;
    transition:transform .08s ease;
  }
  .iconbtn:active{ transform:scale(0.92); }
  .iconbtn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  /* ---------- Play area ---------- */
  main{
    display:flex; flex-direction:column; align-items:center;
    padding:6px 12px 20px;
    gap:14px;
  }
  #status{
    color:#fff;
    font-weight:800;
    font-size:clamp(16px,4.6vw,22px);
    text-align:center;
    min-height:1.4em;
    padding:6px 16px;
    border-radius:999px;
    background:rgba(19,24,58,0.45);
    display:inline-flex; align-items:center; gap:8px;
    text-shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  #status[data-mood="watch"]{ background:rgba(155,93,229,0.55); }
  #status[data-mood="go"]{ background:rgba(6,214,160,0.55); }
  #status[data-mood="oops"]{ background:rgba(255,107,107,0.6); }

  .board{
    width:min(92vw, 70vmin, 460px);
    aspect-ratio:1/1;
    display:grid;
    gap:14px;
    margin-top:2px;
    position:relative;
  }
  .board.cols2{ grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); }
  .board.cols3{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); }

  .pad{
    appearance:none; border:none; cursor:pointer;
    border-radius:var(--radius);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(28px,9vw,52px);
    color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,0.35);
    min-height:48px;
    overflow:hidden;
    filter:brightness(0.62) saturate(0.9);
    box-shadow:inset 0 6px 14px rgba(255,255,255,0.25), inset 0 -10px 22px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.3);
    transition:filter .1s ease, transform .08s ease, box-shadow .12s ease;
  }
  .pad .num{
    position:absolute; top:6px; left:10px;
    font-size:clamp(11px,2.8vw,15px);
    font-weight:800; color:#fff; opacity:0.85;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .pad:focus-visible{ outline:4px solid #fff; outline-offset:-6px; }
  .pad[disabled]{ cursor:default; }

  .pad[data-c="blue"]{   background:radial-gradient(circle at 35% 30%, #8ab6ff, var(--c-blue) 75%); }
  .pad[data-c="orange"]{ background:radial-gradient(circle at 35% 30%, #ffc078, var(--c-orange) 75%); }
  .pad[data-c="green"]{  background:radial-gradient(circle at 35% 30%, #7df0cf, var(--c-green) 75%); }
  .pad[data-c="pink"]{   background:radial-gradient(circle at 35% 30%, #ffb3cd, var(--c-pink) 75%); }
  .pad[data-c="yellow"]{ background:radial-gradient(circle at 35% 30%, #ffe6a3, var(--c-yellow) 75%); }
  .pad[data-c="purple"]{ background:radial-gradient(circle at 35% 30%, #c89bf0, var(--c-purple) 75%); }

  .pad.lit{
    filter:brightness(1.45) saturate(1.25);
    transform:scale(1.03);
    box-shadow:inset 0 6px 14px rgba(255,255,255,0.55), 0 0 30px 8px rgba(255,255,255,0.45), 0 6px 16px rgba(0,0,0,0.3);
  }
  .pad.press{ transform:scale(0.96); }

  /* timeout ring under board for HARD */
  .timer-wrap{ width:min(92vw,70vmin,460px); height:10px; }
  .timer-bar{
    height:10px; border-radius:999px;
    background:rgba(255,255,255,0.25);
    overflow:hidden;
  }
  .timer-bar > i{
    display:block; height:100%;
    background:linear-gradient(90deg, var(--c-yellow), var(--c-orange));
    width:100%;
    transform-origin:left center;
  }

  .replay-btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:999px;
    padding:10px 22px; min-height:48px;
    font-family:var(--font); font-weight:800; font-size:clamp(14px,3.8vw,17px);
    color:var(--ink);
    background:var(--c-yellow);
    box-shadow:0 5px 0 #d9a72f, 0 8px 14px rgba(0,0,0,0.25);
    transition:transform .07s ease, box-shadow .07s ease;
  }
  .replay-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #d9a72f, 0 3px 8px rgba(0,0,0,0.25); }
  .replay-btn:disabled{ opacity:0.4; cursor:default; box-shadow:0 5px 0 #d9a72f; }
  .replay-btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:22px;
    background:rgba(19,24,58,0.72);
    backdrop-filter:blur(4px);
    text-align:center;
    overflow-y:auto;
  }
  .overlay[hidden]{ display:none !important; }
  .panel{
    background:var(--paper); color:var(--ink);
    border-radius:var(--radius);
    padding:22px 20px 26px;
    width:min(94vw, 480px);
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .big-emoji{ font-size:clamp(48px,16vw,84px); line-height:1; }
  .title{ font-size:clamp(26px,7vw,40px); letter-spacing:0.01em; }
  .howto{
    font-size:clamp(15px,4vw,18px); color:var(--ink-soft); font-weight:700; margin:0;
    line-height:1.4;
  }
  .badges{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .badge{
    border-radius:999px; padding:6px 12px; font-weight:800; font-size:clamp(12px,3.2vw,14px);
    display:inline-flex; align-items:center; gap:6px;
  }
  .badge.age{ background:#ede0ff; color:#5b2bb0; }
  .badge.skill{ background:#d7f6ec; color:#067a5a; }

  .difflabel{ font-weight:800; color:var(--ink-soft); font-size:14px; margin-top:2px; }
  .diffrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; }
  .diff{
    appearance:none; cursor:pointer; flex:1 1 100px;
    border:3px solid transparent; border-radius:16px;
    padding:12px 10px; min-height:64px;
    font-family:var(--font); font-weight:800; font-size:clamp(14px,3.8vw,16px);
    background:#f1f2fa; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .07s ease;
  }
  .diff small{ font-weight:700; color:var(--ink-soft); font-size:0.78em; }
  .diff[aria-pressed="true"]{ border-color:var(--c-purple); background:#f3ecff; box-shadow:0 0 0 3px rgba(155,93,229,0.25); }
  .diff:active{ transform:scale(0.96); }
  .diff:focus-visible{ outline:3px solid var(--c-purple); outline-offset:2px; }

  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:999px;
    font-family:var(--font); font-weight:800;
    font-size:clamp(18px,5vw,22px);
    padding:14px 34px; min-height:56px;
    color:#fff;
    background:linear-gradient(180deg,#39d39e,#06d6a0);
    box-shadow:0 6px 0 #049e76, 0 10px 18px rgba(0,0,0,0.28);
    transition:transform .07s ease, box-shadow .07s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:translateY(5px); box-shadow:0 1px 0 #049e76, 0 4px 10px rgba(0,0,0,0.28); }
  .btn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  .btn.secondary{
    background:linear-gradient(180deg,#5a8bff,#3a86ff);
    box-shadow:0 6px 0 #2667cc, 0 10px 18px rgba(0,0,0,0.28);
    font-size:clamp(15px,4.2vw,18px); padding:12px 22px; min-height:50px;
  }
  .btn.secondary:active{ box-shadow:0 1px 0 #2667cc, 0 4px 10px rgba(0,0,0,0.28); }
  .btn.ghost{
    background:#eef0fb; color:var(--ink);
    box-shadow:0 6px 0 #c9cee6, 0 10px 18px rgba(0,0,0,0.28);
    font-size:clamp(15px,4.2vw,18px); padding:12px 22px; min-height:50px;
  }
  .btn.ghost:active{ box-shadow:0 1px 0 #c9cee6, 0 4px 10px rgba(0,0,0,0.28); }

  .endrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; }
  .scoreline{ font-size:clamp(18px,5vw,24px); font-weight:800; }
  .scoreline .num{ color:var(--c-purple); }
  .bestline{ font-size:clamp(15px,4vw,18px); font-weight:800; color:var(--ink-soft); }

  /* ---------- Confetti ---------- */
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:60; }
  .conf{
    position:absolute; top:-30px;
    font-size:24px;
    will-change:transform, opacity;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(-10vh) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  @media (prefers-reduced-motion:reduce){
    .pad, .btn, .diff, .iconbtn, .replay-btn{ transition:none; }
    .pad.lit{ transform:none; }
    .conf{ animation-duration:0.6s !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="iconbtn" id="hubLink" href="../index.html" aria-label="Back to Hub" title="Back to Hub">←</a>
    <div class="hud">
      <div class="chip"><span aria-hidden="true">🔢</span><small>Level</small> <span id="hudLevel">—</span></div>
      <div class="chip"><span aria-hidden="true">⭐</span><small>Score</small> <span id="hudScore">0</span></div>
      <div class="chip"><span aria-hidden="true">🏆</span><small>Best</small> <span id="hudBest">0</span></div>
    </div>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause" title="Pause">⏸</button>
    <button class="iconbtn" id="restartBtn" aria-label="Restart" title="Restart">↻</button>
    <button class="iconbtn" id="muteBtn" aria-label="Mute sound" title="Mute sound">🔊</button>
  </div>

  <main>
    <div id="status" data-mood="watch" aria-live="polite">Press Play to start 🎶</div>
    <div class="board cols2" id="board" aria-label="Simon pads"></div>
    <div class="timer-wrap" id="timerWrap" hidden>
      <div class="timer-bar"><i id="timerBar"></i></div>
    </div>
    <button class="replay-btn" id="replayBtn" type="button" hidden>🔁 Replay (1 left)</button>
  </main>

  <!-- START overlay -->
  <div class="overlay" id="startOverlay">
    <div class="panel">
      <div class="big-emoji" aria-hidden="true">🎶</div>
      <h1 class="title">Simon Sequence</h1>
      <p class="howto">👀 Watch the lights, then tap them back in order!</p>
      <div class="badges">
        <span class="badge age" aria-hidden="true">👧 Age</span>
        <span class="badge age">Core (9-11)</span>
      </div>
      <div class="badges">
        <span class="badge skill">🧠 Skill: Working memory + reaction</span>
      </div>
      <div class="difflabel">Pick a level</div>
      <div class="diffrow" id="diffRow">
        <button class="diff" data-diff="easy"   aria-pressed="false" type="button">🟢 EASY<small>4 pads · slow · replay</small></button>
        <button class="diff" data-diff="medium" aria-pressed="true"  type="button">🟡 MEDIUM<small>4 pads · faster</small></button>
        <button class="diff" data-diff="hard"   aria-pressed="false" type="button">🔴 HARD<small>6 pads · fast · timer</small></button>
      </div>
      <button class="btn" id="playBtn" type="button">Play ▶</button>
    </div>
  </div>

  <!-- PAUSE overlay -->
  <div class="overlay" id="pauseOverlay" hidden>
    <div class="panel">
      <div class="big-emoji" aria-hidden="true">⏸️</div>
      <h2 class="title">Paused</h2>
      <button class="btn" id="resumeBtn" type="button">Resume ▶</button>
      <div class="endrow">
        <button class="btn ghost" id="pauseRestartBtn" type="button">↻ Restart</button>
        <a class="btn secondary" href="../index.html">← Hub</a>
      </div>
    </div>
  </div>

  <!-- GAME OVER overlay -->
  <div class="overlay" id="overOverlay" hidden>
    <div class="panel">
      <div class="big-emoji" id="overEmoji" aria-hidden="true">🌟</div>
      <h2 class="title" id="overHeadline">Great run! 🌟</h2>
      <div class="scoreline">Sequence: <span class="num" id="overScore">0</span></div>
      <div class="bestline">🏆 Best this session: <span id="overBest">0</span></div>
      <div class="endrow">
        <button class="btn" id="againBtn" type="button">Play Again 🔄</button>
      </div>
      <div class="endrow">
        <button class="btn ghost" id="changeLevelBtn" type="button">Change Level</button>
        <a class="btn secondary" href="../index.html">← Hub</a>
      </div>
    </div>
  </div>

  <div id="confetti" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  /* ---------------- Sound ---------------- */
  const Sound=(()=>{let ctx,muted=false;function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol){if(muted)return;dur=dur||0.12;type=type||"sine";vol=vol||0.2;var c=ac();var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);var t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);}
  return{resume:function(){try{ac().resume();}catch(e){}},tone:tone,click:function(){tone(420,0.06,"square",0.15);},good:function(){tone(660,0.1);setTimeout(function(){tone(880,0.12);},90);},bad:function(){tone(160,0.18,"sawtooth",0.15);},win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,0.16,"triangle",0.18);},i*120);});},toggleMute:function(){muted=!muted;return muted;},isMuted:function(){return muted;}};})();

  /* ---------------- Pad definitions ----------------
     Each pad has a DISTINCT color AND shape/symbol (colorblind-safe),
     plus its own musical pitch. */
  const ALL_PADS=[
    { c:"blue",   sym:"●", freq:329.63, label:"blue circle" },
    { c:"orange", sym:"■", freq:392.00, label:"orange square" },
    { c:"green",  sym:"▲", freq:440.00, label:"green triangle" },
    { c:"pink",   sym:"★", freq:523.25, label:"pink star" },
    { c:"yellow", sym:"◆", freq:587.33, label:"yellow diamond" },
    { c:"purple", sym:"⬢", freq:659.25, label:"purple hexagon" }
  ];

  /* ---------------- Difficulty config ---------------- */
  const CONFIG={
    easy:   { pads:4, flashMs:560, gapMs:240, replays:1, inputTimeoutMs:0,     boardCls:"cols2" },
    medium: { pads:4, flashMs:380, gapMs:140, replays:0, inputTimeoutMs:0,     boardCls:"cols2" },
    hard:   { pads:6, flashMs:300, gapMs:90,  replays:0, inputTimeoutMs:2600,  boardCls:"cols3" }
  };

  /* ---------------- DOM ---------------- */
  const $=id=>document.getElementById(id);
  const board=$("board"), statusEl=$("status");
  const hudLevel=$("hudLevel"), hudScore=$("hudScore"), hudBest=$("hudBest");
  const pauseBtn=$("pauseBtn"), restartBtn=$("restartBtn"), muteBtn=$("muteBtn");
  const startOverlay=$("startOverlay"), playBtn=$("playBtn"), diffRow=$("diffRow");
  const pauseOverlay=$("pauseOverlay"), resumeBtn=$("resumeBtn"), pauseRestartBtn=$("pauseRestartBtn");
  const overOverlay=$("overOverlay"), overEmoji=$("overEmoji"), overHeadline=$("overHeadline"),
        overScore=$("overScore"), overBest=$("overBest"), againBtn=$("againBtn"), changeLevelBtn=$("changeLevelBtn");
  const replayBtn=$("replayBtn"), timerWrap=$("timerWrap"), timerBar=$("timerBar");
  const confettiEl=$("confetti");

  /* ---------------- State ---------------- */
  let diff="medium";
  let cfg=CONFIG[diff];
  let pads=[];               // active pad defs for this game
  let padEls={};             // c -> button element
  let sequence=[];           // array of pad colors
  let inputIndex=0;          // where the player is in the current sequence
  let score=0;               // longest sequence fully repeated
  let best=0;                // session best
  let replaysLeft=0;
  let phase="idle";          // idle | showing | input | paused | over
  let pausedFromPhase=null;
  let timers=[];             // pending setTimeout ids to cancel
  let inputTimeoutId=0;
  let inputDeadline=0;
  let timerRAF=0;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  /* ---------------- Helpers ---------------- */
  function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }
  function later(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }

  function setStatus(text,mood){ statusEl.textContent=text; statusEl.dataset.mood=mood||"watch"; }

  function buildBoard(){
    board.className="board "+cfg.boardCls;
    board.innerHTML="";
    padEls={};
    pads=ALL_PADS.slice(0,cfg.pads);
    pads.forEach((p,i)=>{
      const b=document.createElement("button");
      b.className="pad";
      b.type="button";
      b.dataset.c=p.c;
      b.setAttribute("aria-label", p.label+" pad, key "+(i+1));
      b.innerHTML='<span class="num" aria-hidden="true">'+(i+1)+'</span><span aria-hidden="true">'+p.sym+'</span>';
      // Pointer events cover mouse + touch with one handler.
      b.addEventListener("pointerdown",function(ev){ ev.preventDefault(); onPad(p.c); });
      b.addEventListener("keydown",function(ev){
        if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); onPad(p.c); }
      });
      padEls[p.c]=b;
      board.appendChild(b);
    });
  }

  function setPadsEnabled(on){
    pads.forEach(p=>{ padEls[p.c].disabled=!on; });
  }

  function flashPad(c, ms){
    const el=padEls[c]; if(!el) return;
    const p=ALL_PADS.find(x=>x.c===c);
    el.classList.add("lit");
    if(p) Sound.tone(p.freq, Math.max(0.12, ms/1000*0.9), "sine", 0.2);
    later(()=>el.classList.remove("lit"), ms);
  }

  function pressPad(c){
    const el=padEls[c]; if(!el) return;
    const p=ALL_PADS.find(x=>x.c===c);
    el.classList.add("lit","press");
    if(p) Sound.tone(p.freq, 0.18, "sine", 0.2);
    setTimeout(()=>el.classList.remove("lit","press"),180);
  }

  /* ---------------- Game flow ---------------- */
  function startGame(){
    cfg=CONFIG[diff];
    buildBoard();
    sequence=[]; inputIndex=0; score=0; replaysLeft=cfg.replays;
    hudLevel.textContent=labelFor(diff);
    hudScore.textContent="0";
    hudBest.textContent=String(best);
    timerWrap.hidden = !cfg.inputTimeoutMs;
    updateReplayBtn();
    overOverlay.hidden=true; pauseOverlay.hidden=true; startOverlay.hidden=true;
    phase="idle";
    setStatus("Get ready… ✨","watch");
    later(nextRound, 700);
  }

  function labelFor(d){ return d==="easy"?"🟢 Easy":d==="medium"?"🟡 Medium":"🔴 Hard"; }

  function nextRound(){
    inputIndex=0;
    const next=pads[Math.floor(Math.random()*pads.length)].c;
    sequence.push(next);
    showSequence();
  }

  function showSequence(){
    phase="showing";
    setPadsEnabled(false);
    stopInputTimer();
    setStatus("Watch carefully 👀","watch");
    let i=0;
    function step(){
      if(i>=sequence.length){
        beginInput();
        return;
      }
      flashPad(sequence[i], cfg.flashMs);
      i++;
      later(step, cfg.flashMs+cfg.gapMs);
    }
    later(step, 450);
  }

  function beginInput(){
    phase="input";
    inputIndex=0;
    setStatus("Your turn! Tap them back 👆","go");
    setPadsEnabled(true);
    if(cfg.inputTimeoutMs) startInputTimer();
  }

  function onPad(c){
    if(phase!=="input") return;
    Sound.resume();
    pressPad(c);
    const expected=sequence[inputIndex];
    if(c!==expected){
      gameOver();
      return;
    }
    inputIndex++;
    if(cfg.inputTimeoutMs) startInputTimer(); // reset countdown after each correct tap
    if(inputIndex>=sequence.length){
      // Round cleared!
      stopInputTimer();
      score=sequence.length;
      hudScore.textContent=String(score);
      if(score>best){ best=score; hudBest.textContent=String(best); }
      Sound.good();
      phase="showing";
      setPadsEnabled(false);
      setStatus("Nice! +1 ✅","go");
      later(nextRound, 650);
    }
  }

  /* ---- input timeout (HARD) ---- */
  function startInputTimer(){
    stopInputTimer();
    inputDeadline=performance.now()+cfg.inputTimeoutMs;
    timerBar.style.transform="scaleX(1)";
    function tick(){
      const remain=inputDeadline-performance.now();
      const frac=Math.max(0, remain/cfg.inputTimeoutMs);
      timerBar.style.transform="scaleX("+frac+")";
      if(remain<=0){
        timeUp();
        return;
      }
      timerRAF=requestAnimationFrame(tick);
    }
    if(reduced){
      // No smooth bar; just a hard deadline timeout.
      inputTimeoutId=setTimeout(timeUp, cfg.inputTimeoutMs);
    } else {
      timerRAF=requestAnimationFrame(tick);
    }
  }
  function stopInputTimer(){
    if(timerRAF){ cancelAnimationFrame(timerRAF); timerRAF=0; }
    if(inputTimeoutId){ clearTimeout(inputTimeoutId); inputTimeoutId=0; }
    timerBar.style.transform="scaleX(1)";
  }
  function timeUp(){
    if(phase!=="input") return;
    gameOver(true);
  }

  /* ---- replay (EASY) ---- */
  function updateReplayBtn(){
    if(cfg.replays>0){
      replayBtn.hidden=false;
      replayBtn.textContent="🔁 Replay ("+replaysLeft+" left)";
      replayBtn.disabled = replaysLeft<=0;
    } else {
      replayBtn.hidden=true;
    }
  }
  replayBtn.addEventListener("click",function(){
    if(phase!=="input"||replaysLeft<=0) return;
    Sound.click();
    replaysLeft--;
    updateReplayBtn();
    stopInputTimer();
    showSequence();
  });

  /* ---- game over ---- */
  function gameOver(timedOut){
    phase="over";
    clearTimers();
    stopInputTimer();
    setPadsEnabled(false);
    Sound.bad();
    setStatus(timedOut?"Time's up! ⏰":"Oops, wrong pad 🙈","oops");

    overScore.textContent=String(score);
    overBest.textContent=String(best);

    // Encouraging, never punishing.
    let head, emo, celebrate=false;
    if(score>=10){ head="Amazing memory! 🧠✨"; emo="🏆"; celebrate=true; }
    else if(score>=6){ head="Wow, great run! 🌟"; emo="🌟"; celebrate=true; }
    else if(score>=3){ head="Nice work! 👏"; emo="😊"; }
    else { head="Good try! Keep going 💪"; emo="🙂"; }
    // Beating your own best is always a win to celebrate.
    if(score>0 && score===best && score>=3){ celebrate=true; }

    overHeadline.textContent=head;
    overEmoji.textContent=emo;

    later(function(){
      overOverlay.hidden=false;
      if(celebrate){ Sound.win(); burstConfetti(); }
      againBtn.focus();
    }, 700);
  }

  /* ---------------- Pause ---------------- */
  function doPause(){
    if(phase==="idle"||phase==="over"||phase==="paused") return;
    pausedFromPhase=phase;
    phase="paused";
    clearTimers();
    stopInputTimer();
    setPadsEnabled(false);
    pauseOverlay.hidden=false;
    resumeBtn.focus();
  }
  function doResume(){
    if(phase!=="paused") return;
    pauseOverlay.hidden=true;
    // Always re-show the current sequence on resume so the player isn't
    // penalized for forgetting during a pause.
    phase="showing";
    later(showSequence, 250);
  }

  /* ---------------- Confetti ---------------- */
  function burstConfetti(){
    if(reduced){ // tiny celebration only
      const e=document.createElement("div");
      e.className="conf"; e.textContent="🎉";
      e.style.left="50%"; e.style.fontSize="40px";
      e.style.animationDuration="0.6s";
      confettiEl.appendChild(e);
      setTimeout(()=>e.remove(),700);
      return;
    }
    const emojis=["🎉","⭐","🎊","✨","🟢","🟡","🔵","💜","🧡"];
    for(let i=0;i<34;i++){
      const e=document.createElement("div");
      e.className="conf";
      e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      e.style.left=(Math.random()*100)+"%";
      e.style.fontSize=(16+Math.random()*22)+"px";
      e.style.animationDuration=(1.4+Math.random()*1.4)+"s";
      e.style.animationDelay=(Math.random()*0.35)+"s";
      confettiEl.appendChild(e);
      setTimeout(()=>e.remove(), 3200);
    }
  }

  /* ---------------- Difficulty picker ---------------- */
  diffRow.addEventListener("click",function(ev){
    const btn=ev.target.closest(".diff");
    if(!btn) return;
    diff=btn.dataset.diff;
    Array.from(diffRow.querySelectorAll(".diff")).forEach(b=>{
      b.setAttribute("aria-pressed", b===btn?"true":"false");
    });
    Sound.click();
  });

  /* ---------------- Buttons ---------------- */
  function play(){
    Sound.resume();
    Sound.click();
    startGame();
  }
  playBtn.addEventListener("click", play);
  againBtn.addEventListener("click", function(){ Sound.resume(); Sound.click(); startGame(); });
  changeLevelBtn.addEventListener("click", function(){
    Sound.click();
    overOverlay.hidden=true;
    startOverlay.hidden=false;
    phase="idle";
    setStatus("Press Play to start 🎶","watch");
  });
  restartBtn.addEventListener("click", function(){
    if(phase==="idle") return;
    Sound.click();
    startGame();
  });
  pauseBtn.addEventListener("click", function(){ Sound.click(); doPause(); });
  resumeBtn.addEventListener("click", function(){ Sound.click(); doResume(); });
  pauseRestartBtn.addEventListener("click", function(){ Sound.click(); startGame(); });

  muteBtn.addEventListener("click", function(){
    const m=Sound.toggleMute();
    muteBtn.textContent=m?"🔇":"🔊";
    muteBtn.setAttribute("aria-label", m?"Unmute sound":"Mute sound");
    muteBtn.title=muteBtn.getAttribute("aria-label");
  });

  /* ---------------- Keyboard ---------------- */
  document.addEventListener("keydown",function(ev){
    // Number keys 1-6 -> pads (during input only)
    if(phase==="input" && ev.key>="1" && ev.key<="6"){
      const idx=parseInt(ev.key,10)-1;
      if(idx>=0 && idx<pads.length){ ev.preventDefault(); onPad(pads[idx].c); }
      return;
    }
    if(ev.key==="Escape"){
      if(phase==="paused"){ doResume(); }
      else if(phase==="showing"||phase==="input"){ doPause(); }
    }
    if(ev.key==="p"||ev.key==="P"){
      if(phase==="paused"){ doResume(); }
      else { doPause(); }
    }
  });

  // Prevent page scroll/zoom on the board area for touch.
  board.addEventListener("touchmove",function(e){ e.preventDefault(); },{passive:false});

  // Auto-pause if the tab is hidden mid-game.
  document.addEventListener("visibilitychange",function(){
    if(document.hidden && (phase==="showing"||phase==="input")) doPause();
  });

  // Initialize HUD label.
  hudLevel.textContent=labelFor(diff);
})();
</script>
</body>
</html>
