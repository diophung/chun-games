<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory Match 🧠</title>
<style>
:root{
  --bg-grad: linear-gradient(160deg,#2b1e66 0%, #3b2fb0 45%, #1f6feb 100%);
  --paper:#ffffff; --ink:#13183a; --ink-soft:#5b6488;
  --c-blue:#3a86ff; --c-orange:#fb8500; --c-green:#06d6a0; --c-pink:#ff5d8f; --c-yellow:#ffd166; --c-purple:#9b5de5;
  --ok:#06d6a0; --warn:#ff6b6b; --radius:20px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:var(--bg-grad) fixed;
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  -webkit-user-select:none;user-select:none;
}
button{font-family:var(--font);cursor:pointer;border:none;}
button:focus-visible, a:focus-visible{outline:4px solid #fff;outline-offset:3px;}

/* ===== Top bar ===== */
#topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  color:#fff;
  flex-wrap:wrap;
}
.tb-btn{
  background:rgba(255,255,255,.16);
  color:#fff;font-weight:800;font-size:16px;
  border-radius:999px;
  min-width:48px;min-height:48px;
  padding:0 14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 10px rgba(0,0,0,.18);
  text-decoration:none;
  transition:transform .08s ease, background .15s ease;
}
.tb-btn:active{transform:scale(.92);}
.tb-btn.hub{background:rgba(255,255,255,.22);}
.stat{
  background:rgba(255,255,255,.14);
  border-radius:999px;
  padding:8px 14px;
  font-weight:800;font-size:15px;
  display:inline-flex;align-items:center;gap:6px;
  min-height:44px;
}
.spacer{flex:1 1 auto;}
#muteBtn{margin-left:auto;}

/* ===== Board ===== */
#stage{
  flex:1 1 auto;
  display:flex;align-items:center;justify-content:center;
  padding:8px 12px 18px;
  position:relative;
}
#board{
  display:grid;
  gap:min(2.2vmin,14px);
  width:100%;
  max-width:760px;
  margin:0 auto;
  perspective:1000px;
}
.card{
  position:relative;
  aspect-ratio:3/4;
  min-width:48px;min-height:48px;
  border:none;background:transparent;padding:0;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.7,.2,1);
  border-radius:16px;
}
.card .face{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:16px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 6px 14px rgba(20,24,58,.28);
  overflow:hidden;
}
.card .back{
  background:linear-gradient(150deg,#5a52ff 0%,#9b5de5 100%);
  color:#fff;
  font-size:46%;
}
.card .back .qmark{
  font-size:min(8vmin,46px);
  font-weight:800;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.card .front{
  background:var(--paper);
  transform:rotateY(180deg);
  font-size:min(10vmin,54px);
  line-height:1;
}
.card .front .emoji{filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));}
.card.flipped{transform:rotateY(180deg);}
.card.matched{cursor:default;}
.card.matched .front{
  background:linear-gradient(150deg,#d8fff2 0%,#b9f7e3 100%);
  box-shadow:0 0 0 4px var(--ok), 0 6px 14px rgba(6,214,160,.4);
  animation:pop .4s ease;
}
.card.matched .front::after{
  content:"✓";
  position:absolute;top:4px;right:6px;
  font-size:min(3.6vmin,20px);
  color:var(--ok);font-weight:900;
}
.card:not(.matched):not(.flipped):hover .back{filter:brightness(1.08);}
@keyframes pop{0%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
.card.wrong .front{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-5px);}75%{transform:rotateY(180deg) translateX(5px);}}

/* ===== Overlays ===== */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  background:rgba(20,18,52,.55);
  backdrop-filter:blur(3px);
}
.overlay.hidden{display:none;}
.panel{
  background:var(--paper);color:var(--ink);
  border-radius:var(--radius);
  padding:24px 22px 26px;
  width:100%;max-width:440px;
  text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
  max-height:94vh;overflow:auto;
}
.panel h1{font-size:clamp(28px,7vw,40px);font-weight:800;margin:.1em 0 .05em;}
.panel h2{font-size:clamp(24px,6vw,32px);font-weight:800;margin:.1em 0 .2em;}
.big-emoji{font-size:clamp(48px,15vw,76px);line-height:1;}
.howto{font-size:clamp(15px,4.4vw,18px);color:var(--ink-soft);font-weight:600;margin:6px 0 14px;}

.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px;}
.badge{
  font-weight:800;font-size:13px;
  padding:7px 13px;border-radius:999px;
  display:inline-flex;align-items:center;gap:5px;
}
.badge.age{background:#e8f0ff;color:#1f55c9;}
.badge.skill{background:#eafff6;color:#0a7a5a;}

.diff-row{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px;}
.diff-btn{
  width:100%;
  background:#f1f3ff;color:var(--ink);
  border:3px solid transparent;
  border-radius:16px;
  padding:13px 16px;
  font-weight:800;font-size:17px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:56px;
  transition:transform .08s ease, border-color .15s ease, background .15s ease;
}
.diff-btn .sub{font-weight:700;font-size:13px;color:var(--ink-soft);}
.diff-btn:active{transform:scale(.97);}
.diff-btn.sel{border-color:var(--c-purple);background:#f3edff;}
.diff-btn .left{display:flex;align-items:center;gap:8px;}

.btn{
  border-radius:999px;
  font-weight:800;
  padding:14px 22px;
  font-size:18px;
  min-height:56px;
  width:100%;
  box-shadow:0 6px 16px rgba(58,134,255,.35);
  transition:transform .08s ease, filter .15s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  color:#fff;
}
.btn:active{transform:scale(.96);}
.btn.play{background:linear-gradient(150deg,#06d6a0,#3a86ff);}
.btn.primary{background:linear-gradient(150deg,#3a86ff,#9b5de5);}
.btn.alt{background:#eef0fb;color:var(--ink);box-shadow:0 4px 10px rgba(20,24,58,.12);}
.btn.ghost{background:transparent;color:var(--c-purple);box-shadow:none;border:3px solid #e3e0ff;}
.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:6px;}

.result-stats{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:10px 0 6px;
}
.rstat{
  background:#f3f5ff;border-radius:14px;padding:12px 16px;min-width:90px;
}
.rstat .num{font-size:26px;font-weight:800;color:var(--ink);}
.rstat .lab{font-size:12px;font-weight:700;color:var(--ink-soft);}
.best-line{font-weight:800;font-size:17px;margin:10px 0 4px;color:var(--c-purple);}
.encourage{font-size:clamp(18px,5vw,22px);font-weight:800;margin:2px 0 4px;}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.confetti-piece{position:absolute;top:-30px;font-size:24px;will-change:transform;animation:fall 1.6s linear forwards;}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(540deg);opacity:1;}
}

@media (prefers-reduced-motion: reduce){
  .card{transition:none;}
  .card.matched .front,.card.wrong .front{animation:none;}
  .confetti-piece{animation-duration:.9s;}
  .btn:active,.diff-btn:active,.tb-btn:active{transform:none;}
}
</style>
</head>
<body>

<div id="topbar" role="banner">
  <a class="tb-btn hub" href="../index.html" aria-label="Back to Hub" title="Back to Hub">← Hub</a>
  <span class="stat" id="statMoves" aria-live="polite">👣 <span id="moves">0</span></span>
  <span class="stat" id="statTime" aria-live="off">⏱️ <span id="time">0:00</span></span>
  <span class="stat" id="statPairs">🧩 <span id="pairsFound">0</span>/<span id="pairsTotal">0</span></span>
  <span class="stat" id="statLevel">🎚️ <span id="levelName">—</span></span>
  <span class="spacer"></span>
  <button class="tb-btn" id="pauseBtn" aria-label="Pause game" title="Pause">⏸</button>
  <button class="tb-btn" id="restartBtn" aria-label="Restart game" title="Restart">↻</button>
  <button class="tb-btn" id="muteBtn" aria-label="Mute sound" title="Mute">🔊</button>
</div>

<main id="stage">
  <div id="board" role="grid" aria-label="Memory cards"></div>
</main>

<!-- START -->
<div class="overlay" id="startOverlay">
  <div class="panel" role="dialog" aria-label="Start screen">
    <div class="big-emoji">🧠</div>
    <h1>Memory Match</h1>
    <p class="howto">🔎 Flip 2 cards. Find matching pairs! 🎉</p>
    <div class="badges">
      <span class="badge age">🎂 Core (9-11)</span>
      <span class="badge skill">💡 Working memory</span>
    </div>
    <div class="diff-row" role="group" aria-label="Choose difficulty">
      <button class="diff-btn sel" data-diff="easy">
        <span class="left">🟢 Easy</span>
        <span class="sub">4 × 3 · 6 pairs</span>
      </button>
      <button class="diff-btn" data-diff="medium">
        <span class="left">🟡 Medium</span>
        <span class="sub">4 × 4 · 8 pairs</span>
      </button>
      <button class="diff-btn" data-diff="hard">
        <span class="left">🔴 Hard</span>
        <span class="sub">6 × 4 · 12 pairs</span>
      </button>
    </div>
    <button class="btn play" id="playBtn">Play ▶</button>
  </div>
</div>

<!-- PAUSE -->
<div class="overlay hidden" id="pauseOverlay">
  <div class="panel" role="dialog" aria-label="Paused">
    <div class="big-emoji">⏸️</div>
    <h2>Paused</h2>
    <p class="howto">Take a breath. Ready when you are! 😊</p>
    <div class="btn-stack">
      <button class="btn primary" id="resumeBtn">Resume ▶</button>
      <button class="btn alt" id="pauseRestartBtn">Restart ↻</button>
      <a class="btn ghost" href="../index.html">← Hub</a>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="overlay hidden" id="winOverlay">
  <div class="panel" role="dialog" aria-label="You won">
    <div class="big-emoji">🏆</div>
    <h2 class="encourage" id="winTitle">Great run! 🌟</h2>
    <div class="result-stats">
      <div class="rstat"><div class="num" id="winMoves">0</div><div class="lab">👣 Moves</div></div>
      <div class="rstat"><div class="num" id="winTime">0:00</div><div class="lab">⏱️ Time</div></div>
    </div>
    <div class="best-line" id="winBest">🏆 Best: —</div>
    <div class="btn-stack">
      <button class="btn primary" id="againBtn">Play Again 🔄</button>
      <button class="btn alt" id="changeBtn">Change Level</button>
      <a class="btn ghost" href="../index.html">← Hub</a>
    </div>
  </div>
</div>

<div id="confetti" aria-hidden="true"></div>

<script>
/* ============ SOUND ============ */
const Sound=(()=>{let ctx,muted=false;function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
function tone(freq,dur,type,vol){if(muted)return;dur=dur||0.12;type=type||"sine";vol=vol||0.2;var c=ac();var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);var t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);}
return{resume:function(){try{ac().resume();}catch(e){}},tone:tone,click:function(){tone(420,0.06,"square",0.15);},good:function(){tone(660,0.1);setTimeout(function(){tone(880,0.12);},90);},bad:function(){tone(160,0.18,"sawtooth",0.15);},win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,0.16,"triangle",0.18);},i*120);});},toggleMute:function(){muted=!muted;return muted;},isMuted:function(){return muted;}};})();

/* ============ CONFIG ============ */
var DIFFS={
  easy:  {name:"Easy",   cols:4, rows:3, pairs:6,  flipBack:1100},
  medium:{name:"Medium", cols:4, rows:4, pairs:8,  flipBack:1000},
  hard:  {name:"Hard",   cols:6, rows:4, pairs:12, flipBack:850}
};
/* Big pool of clearly distinct emoji. We slice the count we need per game. */
var EMOJI_POOL=[
  "🐶","🐱","🦊","🐼","🦁","🐸","🐵","🐧","🐢","🦄",
  "🍎","🍌","🍇","🍓","🍕","🍩","🍦","🍪","🌮","🧀",
  "⚽","🏀","🎸","🚀","⭐","🌈","🌸","🌵","🍄","🐝",
  "🦋","🐙","🐳","🦖","🚗","✈️","🎈","🎁","💎","🔔"
];

/* ============ STATE ============ */
var selectedDiff="easy";
var state=null;            // active game state
var timerId=null;
var gameGen=0;             // bumps every newGame(); stale timeouts compare against this
var confettiTimer=null;    // pending confetti cleanup
var sessionBest={easy:null,medium:null,hard:null}; // fewest moves per difficulty (in-memory only)

var els={
  board:document.getElementById("board"),
  moves:document.getElementById("moves"),
  time:document.getElementById("time"),
  pairsFound:document.getElementById("pairsFound"),
  pairsTotal:document.getElementById("pairsTotal"),
  levelName:document.getElementById("levelName"),
  startOverlay:document.getElementById("startOverlay"),
  pauseOverlay:document.getElementById("pauseOverlay"),
  winOverlay:document.getElementById("winOverlay"),
  winMoves:document.getElementById("winMoves"),
  winTime:document.getElementById("winTime"),
  winBest:document.getElementById("winBest"),
  winTitle:document.getElementById("winTitle"),
  muteBtn:document.getElementById("muteBtn"),
  confetti:document.getElementById("confetti")
};

/* ============ HELPERS ============ */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(s){var m=Math.floor(s/60);var sec=s%60;return m+":"+(sec<10?"0":"")+sec;}

function startTimer(){
  stopTimer();
  timerId=setInterval(function(){
    if(!state||state.paused||state.over)return;
    state.elapsed=Math.floor((Date.now()-state.startTime-state.pausedTotal)/1000);
    els.time.textContent=fmtTime(state.elapsed);
  },250);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

/* ============ BUILD GAME ============ */
function newGame(diffKey){
  selectedDiff=diffKey;
  var cfg=DIFFS[diffKey];
  stopTimer();
  // invalidate any in-flight resolve timeouts from a prior game
  gameGen++;
  var myGen=gameGen;
  if(state&&state.resolveTimer){clearTimeout(state.resolveTimer);state.resolveTimer=null;}
  // clear any pending confetti cleanup and wipe leftover pieces
  if(confettiTimer){clearTimeout(confettiTimer);confettiTimer=null;}
  els.confetti.innerHTML="";

  // pick emoji and build deck
  var chosen=shuffle(EMOJI_POOL.slice()).slice(0,cfg.pairs);
  var deck=[];
  chosen.forEach(function(em,i){
    deck.push({id:i+"a",emoji:em});
    deck.push({id:i+"b",emoji:em});
  });
  shuffle(deck);

  state={
    gen:myGen,         // identifies this game; stale timeouts compare against gameGen
    cfg:cfg,
    diffKey:diffKey,
    deck:deck,
    flipped:[],        // indices currently face-up (unmatched), max 2
    matched:0,
    moves:0,
    lock:false,        // true during resolve delay
    paused:false,
    over:false,
    startTime:Date.now(),
    pausedTotal:0,
    pauseStarted:0,
    elapsed:0,
    resolveTimer:null, // pending match/no-match setTimeout id
    pendingResolve:null, // resolve fn deferred while paused
    cards:[]           // DOM refs
  };

  // grid layout
  els.board.style.gridTemplateColumns="repeat("+cfg.cols+",1fr)";
  // cap board width so big grids stay tidy on wide screens
  els.board.style.maxWidth=(cfg.cols<=4? "520px":"760px");
  els.board.innerHTML="";

  deck.forEach(function(card,idx){
    var btn=document.createElement("button");
    btn.className="card";
    btn.setAttribute("type","button");
    btn.setAttribute("role","gridcell");
    btn.setAttribute("aria-label","Hidden card");
    btn.dataset.idx=idx;
    btn.innerHTML=
      '<div class="face back"><span class="qmark">?</span></div>'+
      '<div class="face front"><span class="emoji">'+card.emoji+'</span></div>';
    // Explicit touch/pointer activation. A pointer/touch tap activates the card
    // directly and suppresses the browser's synthetic click so it fires once.
    var tapHandled=false;
    function activateFromTap(e){
      if(e&&e.cancelable)e.preventDefault();
      tapHandled=true;
      onCardActivate(idx);
    }
    if(window.PointerEvent){
      btn.addEventListener("pointerup",function(e){
        if(e.pointerType==="mouse"&&e.button!==0)return;
        activateFromTap(e);
      });
    }else{
      btn.addEventListener("touchend",activateFromTap,{passive:false});
    }
    btn.addEventListener("click",function(){
      if(tapHandled){tapHandled=false;return;} // already handled by pointer/touch
      onCardActivate(idx);
    });
    els.board.appendChild(btn);
    state.cards.push(btn);
  });

  // HUD
  els.moves.textContent="0";
  els.time.textContent="0:00";
  els.pairsFound.textContent="0";
  els.pairsTotal.textContent=cfg.pairs;
  els.levelName.textContent=cfg.name;

  startTimer();
}

/* ============ CARD LOGIC ============ */
function onCardActivate(idx){
  if(!state||state.over||state.paused||state.lock)return;
  var card=state.deck[idx];
  var el=state.cards[idx];
  if(el.classList.contains("matched"))return;
  if(state.flipped.indexOf(idx)!==-1)return; // already face-up, don't re-flip same
  if(state.flipped.length>=2)return;

  // flip up
  el.classList.add("flipped");
  el.setAttribute("aria-label","Card showing "+card.emoji);
  Sound.click();
  state.flipped.push(idx);

  if(state.flipped.length===2){
    state.moves++;
    els.moves.textContent=state.moves;
    var a=state.flipped[0],b=state.flipped[1];
    var g=state.gen;              // snapshot: identifies THIS game
    var isMatch=state.deck[a].emoji===state.deck[b].emoji;
    state.lock=true;
    if(!isMatch){
      state.cards[a].classList.add("wrong");
      state.cards[b].classList.add("wrong");
      Sound.bad();
    }

    // The resolve runs after a delay; it must only ever touch the game it was
    // scheduled for. If a new game started (gen changed) or the game is gone,
    // it no-ops. If paused, it defers itself until resume.
    function resolve(){
      if(!state||state.gen!==g)return;        // stale: a newer game replaced this one
      state.resolveTimer=null;
      if(state.over)return;
      if(state.paused){state.pendingResolve=resolve;return;} // run on resume, not paused time
      state.pendingResolve=null;
      if(isMatch){
        state.cards[a].classList.add("matched");
        state.cards[b].classList.add("matched");
        state.cards[a].setAttribute("aria-label","Matched "+state.deck[a].emoji);
        state.cards[b].setAttribute("aria-label","Matched "+state.deck[b].emoji);
        state.matched++;
        els.pairsFound.textContent=state.matched;
        state.flipped=[];
        state.lock=false;
        Sound.good();
        if(state.matched===state.cfg.pairs){win();}
      }else{
        [a,b].forEach(function(i){
          var c=state.cards[i];
          c.classList.remove("flipped","wrong");
          c.setAttribute("aria-label","Hidden card");
        });
        state.flipped=[];
        state.lock=false;
      }
    }
    // Remember the resolve fn so pause can defer it and resume can re-arm it.
    state.pendingResolve=resolve;
    state.resolveTimer=setTimeout(resolve,isMatch?180:state.cfg.flipBack);
  }
}

/* ============ WIN ============ */
function win(){
  state.over=true;
  stopTimer();
  state.elapsed=Math.floor((Date.now()-state.startTime-state.pausedTotal)/1000);

  // session best = fewest moves for this difficulty
  var prev=sessionBest[state.diffKey];
  var isNewBest=false;
  if(prev===null||state.moves<prev){sessionBest[state.diffKey]=state.moves;isNewBest=true;}

  els.winMoves.textContent=state.moves;
  els.winTime.textContent=fmtTime(state.elapsed);
  els.winTitle.textContent=isNewBest?"New record! 🌟":"Great run! 🎉";
  var bestVal=sessionBest[state.diffKey];
  els.winBest.textContent="🏆 Best ("+state.cfg.name+"): "+bestVal+" moves";

  Sound.win();
  burstConfetti();
  showOverlay(els.winOverlay);
}

function burstConfetti(){
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pieces=["🎉","⭐","🎊","🌟","✨","💫","🎈"];
  var n=reduce?14:40;
  for(var i=0;i<n;i++){
    (function(i){
      var s=document.createElement("span");
      s.className="confetti-piece";
      s.textContent=pieces[i%pieces.length];
      s.style.left=(Math.random()*100)+"%";
      s.style.fontSize=(18+Math.random()*22)+"px";
      s.style.animationDelay=(Math.random()*0.4)+"s";
      s.style.animationDuration=((reduce?0.9:1.4)+Math.random()*0.8)+"s";
      els.confetti.appendChild(s);
    })(i);
  }
  // Cover the longest piece animation (reduced: up to 1.7s; normal: up to 2.2s)
  // plus the max start delay (0.4s). Tracked so a new game can cancel it.
  if(confettiTimer)clearTimeout(confettiTimer);
  confettiTimer=setTimeout(function(){confettiTimer=null;els.confetti.innerHTML="";},(reduce?1700:2200)+450);
}

/* ============ OVERLAYS ============ */
function showOverlay(o){o.classList.remove("hidden");}
function hideOverlay(o){o.classList.add("hidden");}

function pauseGame(){
  if(!state||state.over||state.paused)return;
  state.paused=true;
  state.pauseStarted=Date.now();
  // Stop any pending resolve so it doesn't fire (flip cards back) during the pause.
  // state.pendingResolve still holds the fn; resume re-arms it.
  if(state.resolveTimer){
    clearTimeout(state.resolveTimer);
    state.resolveTimer=null;
  }
  showOverlay(els.pauseOverlay);
}
function resumeGame(){
  if(!state||!state.paused)return;
  state.pausedTotal+=Date.now()-state.pauseStarted;
  state.paused=false;
  hideOverlay(els.pauseOverlay);
  // Re-arm a resolve that was deferred (or interrupted) by the pause.
  // The pre-pause hold already elapsed, so a short delay is enough.
  if(state.pendingResolve&&!state.over){
    var fn=state.pendingResolve;
    state.resolveTimer=setTimeout(fn,300);
  }
}

/* ============ DIFFICULTY SELECT ============ */
var diffBtns=Array.prototype.slice.call(document.querySelectorAll(".diff-btn"));
diffBtns.forEach(function(b){
  b.addEventListener("click",function(){
    diffBtns.forEach(function(x){x.classList.remove("sel");x.removeAttribute("aria-pressed");});
    b.classList.add("sel");
    b.setAttribute("aria-pressed","true");
    selectedDiff=b.dataset.diff;
    Sound.click();
  });
});

/* ============ BUTTON WIRING ============ */
document.getElementById("playBtn").addEventListener("click",function(){
  Sound.resume();
  Sound.click();
  hideOverlay(els.startOverlay);
  newGame(selectedDiff);
});

document.getElementById("pauseBtn").addEventListener("click",function(){
  if(state&&!state.over){Sound.click();pauseGame();}
});
document.getElementById("restartBtn").addEventListener("click",function(){
  Sound.click();
  hideOverlay(els.pauseOverlay);hideOverlay(els.winOverlay);
  newGame(selectedDiff);
});

document.getElementById("resumeBtn").addEventListener("click",function(){Sound.click();resumeGame();});
document.getElementById("pauseRestartBtn").addEventListener("click",function(){
  Sound.click();hideOverlay(els.pauseOverlay);newGame(selectedDiff);
});

document.getElementById("againBtn").addEventListener("click",function(){
  Sound.click();hideOverlay(els.winOverlay);newGame(selectedDiff);
});
document.getElementById("changeBtn").addEventListener("click",function(){
  Sound.click();
  stopTimer();
  hideOverlay(els.winOverlay);
  // reflect current selection on start screen
  diffBtns.forEach(function(x){
    var on=x.dataset.diff===selectedDiff;
    x.classList.toggle("sel",on);
    if(on)x.setAttribute("aria-pressed","true");else x.removeAttribute("aria-pressed");
  });
  showOverlay(els.startOverlay);
});

/* mute */
els.muteBtn.addEventListener("click",function(){
  var m=Sound.toggleMute();
  els.muteBtn.textContent=m?"🔇":"🔊";
  els.muteBtn.setAttribute("aria-label",m?"Unmute sound":"Mute sound");
  els.muteBtn.title=m?"Unmute":"Mute";
});

/* keyboard: P=pause/resume, R=restart, Esc=pause */
document.addEventListener("keydown",function(e){
  if(els.startOverlay.classList.contains("hidden")===false)return;
  var k=e.key.toLowerCase();
  if(k==="p"||k==="escape"){
    if(state&&!state.over){
      if(state.paused)resumeGame();else pauseGame();
    }
  }else if(k==="r"){
    if(!els.winOverlay.classList.contains("hidden")||(state&&!state.over)){
      newGame(selectedDiff);
      hideOverlay(els.pauseOverlay);hideOverlay(els.winOverlay);
    }
  }
});

/* prevent gesture scroll/zoom on the board during touch */
els.board.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});

/* keep timer honest if tab hidden then shown (no penalty needed; timer recomputes from start) */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&state&&!state.paused&&!state.over){
    els.time.textContent=fmtTime(Math.floor((Date.now()-state.startTime-state.pausedTotal)/1000));
  }
});
</script>
</body>
</html>
