<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Math Meteor ☄️</title>
<style>
:root{
  --bg-grad: linear-gradient(160deg,#2b1e66 0%, #3b2fb0 45%, #1f6feb 100%);
  --paper:#ffffff; --ink:#13183a; --ink-soft:#5b6488;
  --c-blue:#3a86ff; --c-orange:#fb8500; --c-green:#06d6a0; --c-pink:#ff5d8f; --c-yellow:#ffd166; --c-purple:#9b5de5;
  --ok:#06d6a0; --warn:#ff6b6b; --radius:20px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font);
  background:var(--bg-grad) fixed;
  color:var(--ink);
  overflow:hidden;
  touch-action:manipulation;
}
#app{
  position:relative;
  width:100vw;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
}
/* ---------- Top bar ---------- */
#topbar{
  width:100%;
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;
  flex-wrap:wrap;
  z-index:5;
}
.tb-btn{
  border:none;cursor:pointer;
  background:rgba(255,255,255,.92);
  color:var(--ink);
  font-size:clamp(16px,4.4vmin,22px);
  font-weight:800;
  border-radius:999px;
  min-width:48px;min-height:48px;
  padding:0 12px;
  box-shadow:0 4px 10px rgba(0,0,0,.25);
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .07s ease;
}
.tb-btn:active{transform:scale(.92);}
.tb-btn:focus-visible{outline:3px solid var(--c-yellow);outline-offset:2px;}
.stat{
  background:rgba(255,255,255,.92);
  border-radius:999px;
  padding:6px 12px;
  font-weight:800;
  font-size:clamp(13px,3.4vmin,18px);
  color:var(--ink);
  display:inline-flex;align-items:center;gap:5px;
  min-height:40px;
  box-shadow:0 4px 10px rgba(0,0,0,.18);
}
.spacer{flex:1 1 auto;}
/* ---------- Play area ---------- */
#stage{
  position:relative;
  flex:1 1 auto;
  width:100%;
  min-height:0;
  display:flex;flex-direction:column;
}
#game{
  flex:1 1 auto;
  width:100%;
  display:block;
  background:radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.10), rgba(0,0,0,.10));
  min-height:0;
}
/* ---------- Answer + keypad ---------- */
#controls{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:4;
}
#answerRow{
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin-bottom:6px;
}
#answerBox{
  background:var(--paper);
  color:var(--ink);
  font-weight:800;
  font-size:clamp(24px,7vmin,34px);
  border-radius:14px;
  padding:6px 18px;
  min-width:140px;text-align:center;
  letter-spacing:2px;
  box-shadow:inset 0 0 0 3px rgba(58,134,255,.35), 0 4px 10px rgba(0,0,0,.2);
  min-height:52px;
  display:flex;align-items:center;justify-content:center;
}
#answerBox.empty{color:var(--ink-soft);}
#answerBox.flash-bad{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.key{
  border:none;cursor:pointer;
  background:rgba(255,255,255,.95);
  color:var(--ink);
  font-weight:800;
  font-size:clamp(20px,6vmin,28px);
  border-radius:16px;
  padding:0;
  min-height:54px;
  box-shadow:0 4px 0 rgba(0,0,0,.22);
  transition:transform .06s ease, box-shadow .06s ease;
  user-select:none;
}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22);}
.key:focus-visible{outline:3px solid var(--c-yellow);outline-offset:2px;}
.key.del{background:var(--c-yellow);}
.key.ok{background:var(--c-green);color:#053b2c;}
.key.span2{grid-column:span 1;}
/* ---------- Overlays ---------- */
.overlay{
  position:absolute;inset:0;
  background:rgba(20,16,52,.78);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  z-index:20;
}
.overlay.hidden{display:none;}
.panel{
  background:var(--paper);
  color:var(--ink);
  border-radius:var(--radius);
  padding:18px 18px 20px;
  width:100%;max-width:420px;
  max-height:94%;
  overflow:auto;
  text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}
.panel h1{
  margin:.1em 0 .1em;
  font-size:clamp(26px,8vmin,40px);
  font-weight:800;
  line-height:1.05;
}
.panel .sub{
  color:var(--ink-soft);
  font-size:clamp(14px,3.8vmin,17px);
  margin:.2em 0 .8em;
  font-weight:600;
}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:.4em 0 1em;}
.badge{
  border-radius:999px;
  padding:7px 13px;
  font-weight:800;
  font-size:clamp(12px,3.3vmin,14px);
  display:inline-flex;align-items:center;gap:6px;
}
.badge.age{background:#e7f0ff;color:#1746a2;}
.badge.skill{background:#e6fbf3;color:#066b50;}
.diffs{display:flex;flex-direction:column;gap:9px;margin:.3em 0 1em;}
.diff-btn{
  border:3px solid transparent;cursor:pointer;
  background:#f1f3fb;
  color:var(--ink);
  font-weight:800;
  font-size:clamp(15px,4.4vmin,19px);
  border-radius:16px;
  padding:11px 14px;
  text-align:left;
  display:flex;align-items:center;gap:10px;
  transition:transform .07s ease,border-color .1s ease;
  min-height:54px;
}
.diff-btn .mk{font-size:1.3em;}
.diff-btn small{display:block;color:var(--ink-soft);font-weight:600;font-size:.7em;margin-top:2px;}
.diff-btn:active{transform:scale(.98);}
.diff-btn.sel{border-color:var(--c-blue);background:#e7f0ff;}
.diff-btn:focus-visible{outline:3px solid var(--c-yellow);outline-offset:2px;}
.btn{
  border:none;cursor:pointer;
  font-weight:800;
  border-radius:999px;
  font-size:clamp(17px,5vmin,22px);
  padding:14px 20px;
  min-height:56px;
  width:100%;
  box-shadow:0 6px 0 rgba(0,0,0,.18);
  transition:transform .07s ease,box-shadow .07s ease;
  margin-top:8px;
  color:#fff;
}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18);}
.btn:focus-visible{outline:3px solid var(--c-yellow);outline-offset:2px;}
.btn.play{background:var(--c-green);color:#053b2c;}
.btn.blue{background:var(--c-blue);}
.btn.orange{background:var(--c-orange);}
.btn.ghost{background:#eef1f8;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.10);}
.howto{
  font-size:clamp(14px,4vmin,17px);
  font-weight:700;
  color:var(--ink);
  background:#fff7e0;
  border-radius:14px;
  padding:9px 12px;
  margin:.2em 0 1em;
}
.row2{display:flex;gap:8px;}
.row2 .btn{margin-top:8px;}
.big-emoji{font-size:clamp(46px,16vmin,80px);line-height:1;}
.result-line{font-size:clamp(16px,4.4vmin,20px);font-weight:800;margin:.25em 0;}
.result-best{color:var(--c-purple);}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:30;}
#confetti.hidden{display:none;}
.combo-pop{
  position:absolute;
  font-weight:800;
  color:var(--c-yellow);
  text-shadow:0 2px 6px rgba(0,0,0,.5);
  pointer-events:none;
  font-size:clamp(18px,5vmin,26px);
  z-index:6;
  animation:floatUp .9s ease-out forwards;
}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(-46px) scale(1.25);}}
.blast-pop{
  position:absolute;
  pointer-events:none;
  font-size:clamp(34px,9vmin,52px);
  line-height:1;
  z-index:7;
  transform-origin:center;
  animation:blastPop .5s ease-out forwards;
}
@keyframes blastPop{0%{opacity:1;transform:scale(.4);}45%{opacity:1;transform:scale(1.25);}100%{opacity:0;transform:scale(1.5);}}
.hub-link{text-decoration:none;}
@media (prefers-reduced-motion: reduce){
  #answerBox.flash-bad{animation:none;}
  .combo-pop{animation:none;opacity:0;}
  .blast-pop{animation:none;opacity:0;}
}
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <div id="topbar">
    <a class="tb-btn hub-link" href="../index.html" title="Back to Hub" aria-label="Back to Hub">←🏠</a>
    <div class="stat" id="statScore" aria-live="polite">⭐ <span id="score">0</span></div>
    <div class="stat" id="statLives" aria-live="polite"><span id="lives">❤️❤️❤️</span></div>
    <div class="stat" id="statLevel">📈 Lv <span id="level">1</span></div>
    <div class="spacer"></div>
    <button class="tb-btn" id="pauseBtn" title="Pause" aria-label="Pause" hidden>⏸</button>
    <button class="tb-btn" id="restartBtn" title="Restart" aria-label="Restart" hidden>↻</button>
    <button class="tb-btn" id="muteBtn" title="Mute" aria-label="Toggle sound">🔊</button>
  </div>

  <!-- Stage -->
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div id="answerRow">
      <div id="answerBox" class="empty" aria-live="polite">Type…</div>
    </div>
    <div id="keypad">
      <button class="key" data-d="1">1</button>
      <button class="key" data-d="2">2</button>
      <button class="key" data-d="3">3</button>
      <button class="key" data-d="4">4</button>
      <button class="key" data-d="5">5</button>
      <button class="key" data-d="6">6</button>
      <button class="key" data-d="7">7</button>
      <button class="key" data-d="8">8</button>
      <button class="key" data-d="9">9</button>
      <button class="key del" data-act="del" aria-label="Delete">⌫</button>
      <button class="key" data-d="0">0</button>
      <button class="key ok" data-act="ok" aria-label="Submit answer">✓</button>
    </div>
  </div>

  <canvas id="confetti" class="hidden"></canvas>

  <!-- START overlay -->
  <div class="overlay" id="startOverlay">
    <div class="panel">
      <div class="big-emoji">☄️</div>
      <h1>Math Meteor</h1>
      <div class="sub">Blast falling sums!</div>
      <div class="badges">
        <span class="badge age">🎯 Core (9-11)</span>
        <span class="badge skill">🧮 Numeracy + speed</span>
      </div>
      <div class="howto">⌨️ Type the answer, hit ✓ to blast it! 💥</div>
      <div class="diffs" role="group" aria-label="Choose difficulty">
        <button class="diff-btn sel" data-diff="easy">
          <span class="mk">🟢</span>
          <span>EASY<small>+ and − up to 20, slow, one at a time</small></span>
        </button>
        <button class="diff-btn" data-diff="medium">
          <span class="mk">🟡</span>
          <span>MEDIUM<small>+ − × up to 100, faster</small></span>
        </button>
        <button class="diff-btn" data-diff="hard">
          <span class="mk">🔴</span>
          <span>HARD<small>+ − × ÷ big numbers, up to two meteors</small></span>
        </button>
      </div>
      <button class="btn play" id="playBtn">Play ▶</button>
    </div>
  </div>

  <!-- PAUSE overlay -->
  <div class="overlay hidden" id="pauseOverlay">
    <div class="panel">
      <div class="big-emoji">⏸️</div>
      <h1>Paused</h1>
      <div class="sub">Take a breath 🌬️</div>
      <button class="btn play" id="resumeBtn">Resume ▶</button>
      <button class="btn blue" id="pauseRestartBtn">Restart ↻</button>
      <a class="btn ghost hub-link" href="../index.html">← Hub</a>
    </div>
  </div>

  <!-- GAME OVER overlay -->
  <div class="overlay hidden" id="overOverlay">
    <div class="panel">
      <div class="big-emoji" id="overEmoji">🌟</div>
      <h1 id="overTitle">Great run!</h1>
      <div class="result-line">⭐ Score: <span id="finalScore">0</span></div>
      <div class="result-line result-best">🏆 Best: <span id="bestScore">0</span></div>
      <div class="sub" id="overMsg">You blasted lots of meteors!</div>
      <button class="btn play" id="againBtn">Play Again 🔄</button>
      <button class="btn blue" id="changeBtn">Change Level</button>
      <a class="btn ghost hub-link" href="../index.html">← Hub</a>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
const Sound=(()=>{let ctx,muted=false;function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
function tone(freq,dur,type,vol){if(muted)return;dur=dur||0.12;type=type||"sine";vol=vol||0.2;var c=ac();var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);var t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);}
return{resume:function(){try{ac().resume();}catch(e){}},tone:tone,click:function(){tone(420,0.06,"square",0.15);},good:function(){tone(660,0.1);setTimeout(function(){tone(880,0.12);},90);},bad:function(){tone(160,0.18,"sawtooth",0.15);},win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,0.16,"triangle",0.18);},i*120);});},toggleMute:function(){muted=!muted;return muted;},isMuted:function(){return muted;}};})();

/* ===================== Config ===================== */
var DIFF={
  easy:{
    ops:["+","-"], maxA:20, maxB:20, maxSum:20, maxMul:0, maxMeteors:1,
    baseSpeed:18, speedPerLevel:5, maxSpeed:70,
    baseSpawn:2600, spawnPerLevel:90, minSpawn:1500,
    pointsPerLevel:60, label:"🟢 Easy"
  },
  medium:{
    ops:["+","-","x"], maxA:100, maxB:100, maxSum:0, maxMul:100, maxMeteors:1,
    baseSpeed:28, speedPerLevel:7, maxSpeed:95,
    baseSpawn:2200, spawnPerLevel:110, minSpawn:1200,
    pointsPerLevel:90, label:"🟡 Medium"
  },
  hard:{
    ops:["+","-","x","/"], maxA:200, maxB:200, maxSum:0, maxMul:300, maxMeteors:2,
    baseSpeed:36, speedPerLevel:9, maxSpeed:120,
    baseSpawn:1900, spawnPerLevel:130, minSpawn:950,
    pointsPerLevel:120, label:"🔴 Hard"
  }
};
var METEOR_COLORS=["#3a86ff","#fb8500","#06d6a0","#ff5d8f","#ffd166","#9b5de5"];
var METEOR_ICONS=["☄️","🪐","🌟","⭐","🔥","💫"];

/* ===================== State ===================== */
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
var W=0,H=0; // CSS pixels of canvas

var state={
  running:false, paused:false, over:false,
  diff:"easy", cfg:DIFF.easy,
  score:0, lives:3, level:1,
  best:0,
  meteors:[], particles:[], spawnTimer:0, nextSpawnAt:0,
  answer:"", combo:0, lastTime:0,
  starfield:[]
};

/* ===================== Sizing ===================== */
function fit(){
  var rect=canvas.getBoundingClientRect();
  W=Math.max(120,Math.floor(rect.width));
  H=Math.max(120,Math.floor(rect.height));
  DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildStars();
  // keep meteors inside bounds horizontally
  for(var i=0;i<state.meteors.length;i++){
    var m=state.meteors[i];
    if(m.x>W-m.r) m.x=W-m.r;
    if(m.x<m.r) m.x=m.r;
  }
}
function buildStars(){
  state.starfield=[];
  var n=Math.round((W*H)/16000);
  for(var i=0;i<n;i++){
    state.starfield.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.3,a:Math.random()*0.5+0.2});
  }
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){setTimeout(fit,200);});

/* ===================== Problem generator ===================== */
function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function makeProblem(cfg){
  var op=cfg.ops[ri(0,cfg.ops.length-1)];
  var a,b,ans,text;
  if(op==="+"){
    if(cfg.maxSum){
      // keep the SUM within the cap (e.g. EASY: + within 20)
      a=ri(1,Math.min(cfg.maxA,cfg.maxSum-1));
      b=ri(1,Math.max(1,cfg.maxSum-a));
    }else{
      a=ri(1,cfg.maxA); b=ri(1,cfg.maxB);
    }
    ans=a+b; text=a+" + "+b;
  }else if(op==="-"){
    a=ri(1,cfg.maxA); b=ri(0,a); // non-negative; b===a yields answer 0 (now answerable)
    ans=a-b; text=a+" − "+b;
  }else if(op==="x"){
    // keep the PRODUCT within maxMul; pick a, then bound b so a*b<=maxMul
    var cap=cfg.maxMul||100;
    var lo=2;
    var aHi=Math.max(lo,Math.floor(cap/lo));
    a=ri(lo,aHi);
    var bHi=Math.max(lo,Math.floor(cap/a));
    b=ri(lo,bHi);
    ans=a*b; text=a+" × "+b;
  }else{ // division -> clean integer
    var dCap=cfg.maxMul||144;
    var divisorHi=Math.min(12,Math.max(2,Math.floor(dCap/2)));
    b=ri(2,divisorHi);
    var quotHi=Math.max(2,Math.floor(dCap/b));
    ans=ri(2,quotHi);
    a=b*ans; text=a+" ÷ "+b;
  }
  return {text:text, answer:ans};
}

/* ===================== Meteor ===================== */
function spawnMeteor(){
  var cfg=state.cfg;
  if(state.meteors.length>=cfg.maxMeteors) return;
  var p=makeProblem(cfg);
  var r=Math.max(34,Math.min(W*0.13,52));
  var x=ri(Math.ceil(r+8),Math.max(Math.ceil(r+8),Math.floor(W-r-8)));
  var idx=ri(0,METEOR_COLORS.length-1);
  var speed=Math.min(cfg.maxSpeed, cfg.baseSpeed+(state.level-1)*cfg.speedPerLevel);
  // randomize speed a touch
  speed=speed*(0.9+Math.random()*0.25);
  state.meteors.push({
    x:x, y:-r-10, r:r,
    vy:speed,
    text:p.text, answer:p.answer,
    color:METEOR_COLORS[idx], icon:METEOR_ICONS[idx%METEOR_ICONS.length],
    spin:Math.random()*Math.PI*2, vspin:(Math.random()-0.5)*1.2,
    wob:Math.random()*Math.PI*2, dying:false, deathT:0
  });
}
function scheduleSpawn(){
  var cfg=state.cfg;
  var interval=Math.max(cfg.minSpawn, cfg.baseSpawn-(state.level-1)*cfg.spawnPerLevel);
  state.nextSpawnAt=interval*(0.85+Math.random()*0.3);
  state.spawnTimer=0;
}

/* ===================== Particles ===================== */
function burst(x,y,color){
  var n=18;
  for(var i=0;i<n;i++){
    var ang=Math.random()*Math.PI*2;
    var sp=40+Math.random()*160;
    state.particles.push({
      x:x,y:y,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      life:0.6+Math.random()*0.4, age:0,
      r:2+Math.random()*4, color:Math.random()<0.5?color:"#ffd166"
    });
  }
}

/* ===================== Game flow ===================== */
function setLivesDisplay(){
  var hearts="";
  for(var i=0;i<3;i++) hearts+= (i<state.lives?"❤️":"🤍");
  document.getElementById("lives").textContent=hearts;
}
function updateHUD(){
  document.getElementById("score").textContent=state.score;
  document.getElementById("level").textContent=state.level;
  setLivesDisplay();
}
function setGameButtonsVisible(visible){
  var pb=document.getElementById("pauseBtn");
  var rb=document.getElementById("restartBtn");
  pb.hidden=!visible;
  rb.hidden=!visible;
}
function startGame(diff){
  state.diff=diff;
  state.cfg=DIFF[diff];
  state.running=true; state.paused=false; state.over=false;
  state.score=0; state.lives=3; state.level=1;
  state.meteors=[]; state.particles=[]; state.answer="";
  state.combo=0;
  updateAnswerBox();
  updateHUD();
  setGameButtonsVisible(true);
  hide("startOverlay"); hide("pauseOverlay"); hide("overOverlay");
  fit();
  scheduleSpawn();
  spawnMeteor();
  state.lastTime=performance.now();
  requestAnimationFrame(loop);
}
function recomputeLevel(){
  var lv=1+Math.floor(state.score/state.cfg.pointsPerLevel);
  if(lv!==state.level){
    state.level=lv;
    document.getElementById("level").textContent=state.level;
  }
}
function loseLife(){
  state.lives--;
  state.combo=0;
  setLivesDisplay();
  Sound.bad();
  if(state.lives<=0){
    gameOver();
  }
}
function gameOver(){
  state.running=false; state.over=true;
  var newBest=(state.score>0 && state.score>state.best);
  if(state.score>state.best) state.best=state.score;
  document.getElementById("finalScore").textContent=state.score;
  document.getElementById("bestScore").textContent=state.best;
  // Encouraging messages
  var title,emoji,msg;
  if(state.score>=state.cfg.pointsPerLevel*4){
    title="Math Star! 🌟"; emoji="🏆"; msg="Wow — super speedy brain!";
    Sound.win(); celebrate();
  }else if(state.score>=state.cfg.pointsPerLevel){
    title="Great run! 🌟"; emoji="🌟"; msg="You blasted lots of meteors!";
    Sound.win(); celebrate();
  }else{
    title="Nice try! 💪"; emoji="🚀"; msg="Every round makes you faster!";
  }
  if(newBest){
    msg="New best score! 🎉 "+msg;
  }
  document.getElementById("overTitle").textContent=title;
  document.getElementById("overEmoji").textContent=emoji;
  document.getElementById("overMsg").textContent=msg;
  show("overOverlay");
}
function pauseGame(){
  if(!state.running||state.over) return;
  state.paused=true;
  show("pauseOverlay");
}
function resumeGame(){
  if(!state.running||state.over) return;
  state.paused=false;
  hide("pauseOverlay");
  state.lastTime=performance.now();
  requestAnimationFrame(loop);
}

/* ===================== Answer handling ===================== */
function updateAnswerBox(){
  var box=document.getElementById("answerBox");
  if(state.answer===""){
    box.textContent="Type…";
    box.classList.add("empty");
  }else{
    box.textContent=state.answer;
    box.classList.remove("empty");
  }
}
function pushDigit(d){
  if(!state.running||state.paused||state.over) return;
  if(state.answer.length>=4) return;
  // Strip a leading zero when a non-zero digit follows, so "0" stays answerable
  // (subtraction like 7 − 7 = 0) but "05" never appears.
  if(state.answer==="0"){
    if(d==="0") return; // "00" is meaningless
    state.answer=""; // replace lone leading zero with the new digit
  }
  state.answer+=d;
  updateAnswerBox();
  Sound.click();
}
function delDigit(){
  if(!state.running||state.paused||state.over) return;
  state.answer=state.answer.slice(0,-1);
  updateAnswerBox();
}
function submitAnswer(){
  if(!state.running||state.paused||state.over) return;
  if(state.answer==="") return;
  var val=parseInt(state.answer,10);
  // find lowest (closest to ground) matching meteor
  var target=null;
  for(var i=0;i<state.meteors.length;i++){
    var m=state.meteors[i];
    if(m.dying) continue;
    if(m.answer===val){
      if(!target || m.y>target.y) target=m;
    }
  }
  if(target){
    blastMeteor(target);
    state.answer="";
    updateAnswerBox();
  }else{
    // wrong / no match
    var box=document.getElementById("answerBox");
    box.classList.remove("flash-bad");
    void box.offsetWidth;
    box.classList.add("flash-bad");
    state.combo=0;
    Sound.bad();
    state.answer="";
    updateAnswerBox();
  }
}
function blastMeteor(m){
  m.dying=true; m.deathT=0;
  burst(m.x,m.y,m.color);
  showBlastEmoji(m.x,m.y); // literal 💥 explosion sprite
  Sound.good();
  state.combo++;
  var pts=10;
  var bonus=0;
  if(state.combo>=2){ bonus=(state.combo-1)*5; }
  state.score+=pts+bonus;
  document.getElementById("score").textContent=state.score;
  recomputeLevel();
  // combo popup
  if(state.combo>=2){
    showComboPop(m.x,m.y,"x"+state.combo+" +"+(pts+bonus));
  }
}
function showComboPop(x,y,txt){
  var stage=document.getElementById("stage");
  var rect=canvas.getBoundingClientRect();
  var stageRect=stage.getBoundingClientRect();
  var el=document.createElement("div");
  el.className="combo-pop";
  el.textContent=txt;
  el.style.left=(x-20)+"px";
  el.style.top=((rect.top-stageRect.top)+y-30)+"px";
  stage.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },950);
}
function showBlastEmoji(x,y){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var stage=document.getElementById("stage");
  var rect=canvas.getBoundingClientRect();
  var stageRect=stage.getBoundingClientRect();
  var el=document.createElement("div");
  el.className="blast-pop";
  el.textContent="💥";
  el.style.left=(x-22)+"px";
  el.style.top=((rect.top-stageRect.top)+y-22)+"px";
  stage.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },520);
}

/* ===================== Main loop ===================== */
function loop(now){
  if(!state.running||state.paused||state.over) return;
  var dt=(now-state.lastTime)/1000;
  if(dt>0.05) dt=0.05; // clamp
  state.lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt){
  var cfg=state.cfg;
  // spawn
  state.spawnTimer+=dt*1000;
  if(state.spawnTimer>=state.nextSpawnAt){
    spawnMeteor();
    scheduleSpawn();
  }
  // meteors
  for(var i=state.meteors.length-1;i>=0;i--){
    var m=state.meteors[i];
    if(m.dying){
      m.deathT+=dt;
      if(m.deathT>0.35){ state.meteors.splice(i,1); }
      continue;
    }
    m.y+=m.vy*dt;
    m.spin+=m.vspin*dt;
    m.wob+=dt*2;
    var groundY=H-6;
    if(m.y+m.r>=groundY){
      // hit the ground
      burst(m.x,groundY,"#ff6b6b");
      state.meteors.splice(i,1);
      loseLife();
      if(state.over) return;
    }
  }
  // particles
  for(var j=state.particles.length-1;j>=0;j--){
    var p=state.particles[j];
    p.age+=dt;
    if(p.age>=p.life){ state.particles.splice(j,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=120*dt; // gravity
    p.vx*=0.98;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // stars
  for(var s=0;s<state.starfield.length;s++){
    var st=state.starfield[s];
    ctx.globalAlpha=st.a;
    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.arc(st.x,st.y,st.s,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // ground line
  ctx.fillStyle="rgba(255,255,255,.16)";
  ctx.fillRect(0,H-6,W,6);
  // warning hatch near ground
  ctx.fillStyle="rgba(255,107,107,.18)";
  ctx.fillRect(0,H-26,W,20);

  // meteors
  for(var i=0;i<state.meteors.length;i++){
    drawMeteor(state.meteors[i]);
  }
  // particles
  for(var j=0;j<state.particles.length;j++){
    var p=state.particles[j];
    var lifeRatio=1-(p.age/p.life);
    ctx.globalAlpha=Math.max(0,lifeRatio);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawMeteor(m){
  var scale=1;
  var alpha=1;
  if(m.dying){
    var t=m.deathT/0.35;
    scale=1+t*0.8;
    alpha=1-t;
  }
  var wobX=Math.sin(m.wob)*3;
  var cx=m.x+wobX, cy=m.y;
  var r=m.r*scale;

  ctx.save();
  ctx.globalAlpha=alpha;

  // glowing trail
  ctx.save();
  var grd=ctx.createLinearGradient(cx,cy-r,cx,cy-r*3.2);
  grd.addColorStop(0, hexA(m.color,0.55));
  grd.addColorStop(1, hexA(m.color,0));
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(cx-r*0.55,cy-r*0.2);
  ctx.lineTo(cx,cy-r*3.2);
  ctx.lineTo(cx+r*0.55,cy-r*0.2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // body
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  var bodyGrad=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.2,cx,cy,r);
  bodyGrad.addColorStop(0, lighten(m.color));
  bodyGrad.addColorStop(1, m.color);
  ctx.fillStyle=bodyGrad;
  ctx.fill();
  // ring outline (shape cue, not color-only)
  ctx.lineWidth=3;
  ctx.strokeStyle="rgba(255,255,255,.85)";
  ctx.stroke();

  // problem text
  ctx.fillStyle="#13183a";
  ctx.font="800 "+Math.round(r*0.52)+"px "+getFont();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  // white plate behind text for contrast
  var tw=ctx.measureText(m.text).width;
  ctx.fillStyle="rgba(255,255,255,.92)";
  roundRect(cx-tw/2-8, cy-r*0.34, tw+16, r*0.68, 8);
  ctx.fill();
  ctx.fillStyle="#13183a";
  ctx.fillText(m.text, cx, cy);

  ctx.restore();
}

/* ===================== Canvas helpers ===================== */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function getFont(){return 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';}
function hexA(hex,a){
  var c=hex.replace("#","");
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}
function lighten(hex){
  var c=hex.replace("#","");
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.min(255,Math.round(r+(255-r)*0.5));
  g=Math.min(255,Math.round(g+(255-g)*0.5));
  b=Math.min(255,Math.round(b+(255-b)*0.5));
  return "rgb("+r+","+g+","+b+")";
}

/* ===================== Overlays ===================== */
function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}

/* ===================== Confetti ===================== */
var confCanvas=document.getElementById("confetti");
var confCtx=confCanvas.getContext("2d");
var confParticles=[], confRAF=null;
function celebrate(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  confCanvas.classList.remove("hidden");
  var rect=document.getElementById("app").getBoundingClientRect();
  confCanvas.width=Math.floor(rect.width*DPR);
  confCanvas.height=Math.floor(rect.height*DPR);
  confCanvas.style.width=rect.width+"px";
  confCanvas.style.height=rect.height+"px";
  confCtx.setTransform(DPR,0,0,DPR,0,0);
  confParticles=[];
  var emojis=["🎉","⭐","🌟","✨","☄️","💫","🎊"];
  for(var i=0;i<70;i++){
    confParticles.push({
      x:Math.random()*rect.width,
      y:-20-Math.random()*rect.height*0.5,
      vy:80+Math.random()*160,
      vx:(Math.random()-0.5)*60,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-0.5)*5,
      ch:emojis[Math.floor(Math.random()*emojis.length)],
      size:18+Math.random()*18,
      life:0
    });
  }
  var last=performance.now();
  function step(now){
    var dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;
    var rect2=document.getElementById("app").getBoundingClientRect();
    confCtx.clearRect(0,0,rect2.width,rect2.height);
    var alive=false;
    for(var i=0;i<confParticles.length;i++){
      var p=confParticles[i];
      p.life+=dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      p.vy+=40*dt;
      if(p.y<rect2.height+30) alive=true;
      confCtx.save();
      confCtx.translate(p.x,p.y);
      confCtx.rotate(p.rot);
      confCtx.font=p.size+"px serif";
      confCtx.textAlign="center"; confCtx.textBaseline="middle";
      confCtx.fillText(p.ch,0,0);
      confCtx.restore();
    }
    if(alive && confParticles.length){
      confRAF=requestAnimationFrame(step);
    }else{
      confCanvas.classList.add("hidden");
      confCtx.clearRect(0,0,rect2.width,rect2.height);
    }
  }
  if(confRAF) cancelAnimationFrame(confRAF);
  confRAF=requestAnimationFrame(step);
}

/* ===================== Input wiring ===================== */
// difficulty selection
var selectedDiff="easy";
var diffBtns=document.querySelectorAll(".diff-btn");
diffBtns.forEach(function(b){
  b.addEventListener("click",function(){
    diffBtns.forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");
    selectedDiff=b.getAttribute("data-diff");
    Sound.click();
  });
});

// Play
document.getElementById("playBtn").addEventListener("click",function(){
  Sound.resume();
  Sound.click();
  startGame(selectedDiff);
});

// keypad (pointer)
var keypad=document.getElementById("keypad");
keypad.addEventListener("pointerdown",function(e){
  var k=e.target.closest(".key");
  if(!k) return;
  e.preventDefault();
  var act=k.getAttribute("data-act");
  var d=k.getAttribute("data-d");
  if(d!=null) pushDigit(d);
  else if(act==="del") delDigit();
  else if(act==="ok") submitAnswer();
});

// top bar buttons
document.getElementById("pauseBtn").addEventListener("click",function(){
  Sound.click();
  if(state.paused) resumeGame(); else pauseGame();
});
document.getElementById("restartBtn").addEventListener("click",function(){
  Sound.click();
  if(state.over||state.running) startGame(state.diff);
});
document.getElementById("muteBtn").addEventListener("click",function(){
  var m=Sound.toggleMute();
  this.textContent=m?"🔇":"🔊";
  this.setAttribute("aria-label", m?"Unmute":"Mute");
});

// pause overlay buttons
document.getElementById("resumeBtn").addEventListener("click",function(){Sound.click();resumeGame();});
document.getElementById("pauseRestartBtn").addEventListener("click",function(){Sound.click();startGame(state.diff);});

// game over buttons
document.getElementById("againBtn").addEventListener("click",function(){Sound.resume();Sound.click();startGame(state.diff);});
document.getElementById("changeBtn").addEventListener("click",function(){
  Sound.click();
  state.over=false;
  setGameButtonsVisible(false);
  hide("overOverlay");
  show("startOverlay");
});

// physical keyboard
window.addEventListener("keydown",function(e){
  if(e.key>="0"&&e.key<="9"){
    if(state.running&&!state.paused&&!state.over){ pushDigit(e.key); e.preventDefault(); }
  }else if(e.key==="Backspace"){
    if(state.running&&!state.paused&&!state.over){ delDigit(); e.preventDefault(); }
  }else if(e.key==="Enter"){
    if(state.running&&!state.paused&&!state.over){ submitAnswer(); e.preventDefault(); }
  }else if(e.key==="Escape"||e.key==="p"||e.key==="P"){
    if(state.running&&!state.over){ if(state.paused) resumeGame(); else pauseGame(); }
  }
});

// prevent page scroll/zoom on touch within controls & stage
["touchmove"].forEach(function(ev){
  document.getElementById("controls").addEventListener(ev,function(e){e.preventDefault();},{passive:false});
  document.getElementById("stage").addEventListener(ev,function(e){e.preventDefault();},{passive:false});
});

/* ===================== Boot ===================== */
window.addEventListener("load",function(){ fit(); draw(); });
fit();
draw();
</script>
