<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Chun-Ga · Child Feeder</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #ffe7f0 0%, #fff5db 100%);
      color: #2a2a3a;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    #app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #age-stage {
      text-align: center;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 600;
      padding: 8px 0;
      background: rgba(255,255,255,0.6);
      border-radius: 12px;
    }
    #hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      background: rgba(255,255,255,0.45);
      border-radius: 16px;
      padding: 12px;
    }
    #status-text {
      margin: 8px 0 0;
      min-height: 1.3em;
      font-style: italic;
      color: #555;
      text-align: center;
    }
    #bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255,255,255,0.6);
      padding: 12px;
      border-radius: 12px;
    }
    section.actions {
      background: rgba(255,255,255,0.6);
      padding: 12px;
      border-radius: 12px;
    }
    section.actions h3 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.15);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 44px;
      min-width: 56px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 14px;
      transition: transform 80ms ease, background 120ms ease;
    }
    button:hover:not(:disabled) { background: #fafaff; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button .emoji { font-size: 22px; line-height: 1; }
    button .label { font-size: 11px; color: #444; }
    #sleep-btn {
      align-self: stretch;
      min-height: 56px;
      font-size: 16px;
      background: #d8e8ff;
      flex-direction: row;
      gap: 8px;
    }
  </style>
</head>
<body>
  <main id="app">
    <header id="age-stage">Age 3 · Stage: Toddler</header>
    <div id="hero">
      <div id="hero-stage"></div>
      <p id="status-text"></p>
    </div>
    <section id="bars"></section>
    <section id="foods" class="actions">
      <h3>Foods</h3>
      <div class="btn-grid" id="foods-grid"></div>
    </section>
    <section id="activities" class="actions">
      <h3>Activities</h3>
      <div class="btn-grid" id="activities-grid"></div>
    </section>
    <button id="sleep-btn"><span class="emoji">😴</span><span>Sleep</span></button>
    <section id="end-screen" hidden></section>
  </main>
  <script>
    (function () {
      "use strict";
      // Game logic added in later tasks.
    })();
  </script>
</body>
</html>
